<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opener · That's Really Interesting! — Leo's App 🐻‍❄️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../../lib/leea-cloud-config.js"></script>
<script src="../../../../lib/leea-cloud.js"></script>
<script src="../../../../lib/leea-engine.js"></script>
</head><body><script>
LEEA.lesson({
  id: 'leo-4-8-opener',
  titleIcon: '🐻‍❄️',
  title: "That's Really Interesting!",
  subtitle: "Unit 8 · Opener · Leo's practice",
  reviewSubtitle: "Unit 8 · Opener · That's Really Interesting!",
  theme: 'green',
  modules: [

    /* ── M1: In This Unit I Will ─────────────────────────────────────── */
    {
      id: 'm1', type: 'custom', icon: '📋', title: 'In This Unit I Will',
      sub: '4 goals — tap each to reveal',
      render(el, api) {
        const GOALS = [
          { em:'🎯', text:'Talk about my hobbies and interests' },
          { em:'👥', text:'Give information about people I know' },
          { em:'🎁', text:"Talk about gifts I've received" },
          { em:'✍️', text:'Describe and explain a hobby' }
        ];
        const saved = api.load('tapped', []);
        const tipped = saved.length >= 4;
        let html = '<p style="background:var(--green-l);border:2px solid var(--green);border-radius:13px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--green-d);margin-bottom:14px">💬 Tap each goal to reveal it! These are the 4 things you\'ll do in Unit 8.</p>';
        html += '<div id="m1-goals" style="display:flex;flex-direction:column;gap:10px">';
        GOALS.forEach((g, i) => {
          const on = saved.includes(i);
          html += `<div data-i="${i}" onclick="m1Tap(${i})" style="background:${on?'var(--green-l)':'#fff'};border:2px ${on?'solid':'dashed'} ${on?'var(--green)':'var(--border)'};border-radius:13px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s">
            <span style="font-size:2rem;filter:${on?'none':'grayscale(.8) opacity(.5)'};transition:filter .25s">${g.em}</span>
            <span style="font-weight:700;font-size:15px;flex:1;color:var(--ink)">${g.text}</span>
            <span style="font-size:1.2rem;color:var(--green);opacity:${on?1:0};transition:opacity .25s">✓</span>
          </div>`;
        });
        html += '</div>';
        html += `<div id="m1-summary" style="display:${tipped?'block':'none'};background:var(--green-l);border:2px solid var(--green);border-radius:13px;padding:14px;margin-top:12px;font-weight:700;color:var(--green-d)">🌟 Goals unlocked! Your final project: present <strong>your hobby</strong> — soccer! ⚽</div>`;
        el.innerHTML = html;

        window.m1Tap = function(i) {
          if (api.isReview) return;
          const tapped = api.load('tapped', []);
          if (tapped.includes(i)) return;
          tapped.push(i);
          api.save('tapped', tapped);
          const card = document.querySelector('#m1-goals [data-i="' + i + '"]');
          if (card) {
            card.style.background = 'var(--green-l)';
            card.style.border = '2px solid var(--green)';
            card.querySelector('span:first-child').style.filter = 'none';
            card.querySelector('span:last-child').style.opacity = '1';
          }
          if (tapped.length >= 4) {
            document.getElementById('m1-summary').style.display = 'block';
            api.complete('In This Unit I Will');
          }
        };
      },
      review(api) {
        const t = api.load('tapped', []);
        return t.length ? `<div class="rv-card"><div class="rv-lbl">IN THIS UNIT I WILL</div><div class="rv-val">${t.length}/4 goals revealed ✓</div></div>` : '';
      }
    },

    /* ── M2: What Is a Hobby? (4 animated scenes + quick checks) ─────── */
    {
      id: 'm2', type: 'custom', icon: '🏠', title: 'What Is a Hobby?',
      sub: '4 interactive scenes & checks',
      render(el, api) {
        if (!document.getElementById('opener-css')) {
          const s = document.createElement('style'); s.id = 'opener-css';
          s.textContent = `
.sc-card{background:#fff;border:2px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.sc-card.done{border-color:var(--green)}
.sc-head{padding:10px 14px;display:flex;align-items:center;gap:10px;background:var(--bg)}
.sc-num{background:var(--green);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.sc-word{font-weight:800;font-size:16px;color:var(--green-d);flex:1}
.sc-tick{font-size:18px;color:var(--green);opacity:0;transition:opacity .3s}
.sc-card.done .sc-tick{opacity:1}
.sc-stage{height:170px;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sc-stage.snow{background:linear-gradient(180deg,#0EA5E9 0%,#7DD3FC 40%,#F0F9FF 100%)}
.sc-stage.studio{background:linear-gradient(135deg,#1E293B 0%,#475569 100%)}
.sc-stage.park{background:linear-gradient(180deg,#7DD3FC 0%,#BBF7D0 100%)}
.sc-stage.split{background:#fff;cursor:default;flex-direction:row}
.sc-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:700;white-space:nowrap;z-index:5}
.sc-msg{position:absolute;bottom:6px;left:8px;right:8px;background:rgba(15,61,46,.9);color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;z-index:6}
.sc-msg.show{opacity:1}
.sc-qc{padding:12px 14px;background:var(--bg);border-top:1px solid var(--border)}
.htile{background:rgba(255,255,255,.55);border:2px solid rgba(15,61,46,.3);border-radius:8px;padding:8px 4px;cursor:pointer;text-align:center;filter:grayscale(.7) opacity(.55);transition:all .25s;font-size:1.4rem;flex:1 0 28%}
.htile.lit{filter:none;border-color:var(--green);background:#fff}
.htile-lb{font-size:11px;font-weight:800;color:var(--green-d);margin-top:2px;display:none}
.htile.lit .htile-lb{display:block}
.sp-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:14px}
.sp-box.boring{background:linear-gradient(135deg,#475569,#64748B);color:#CBD5E1}
.sp-box.fun{background:linear-gradient(135deg,#F59E0B,#FB923C);color:#fff}
.sp-ver{font-size:13px;font-weight:900;letter-spacing:1px;display:none;text-align:center}
.sp-box.shown .sp-ver{display:block}
@keyframes camshake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-52%,-52%) rotate(-3deg)}75%{transform:translate(-48%,-48%) rotate(3deg)}}
`;
          document.head.appendChild(s);
        }

        const defs = [
          { n:1, word:'📷 photographer', bg:'snow', hint:'Tap the scene!',
            msg:'A <b>photographer</b> takes photos — even of curious polar bears! 📷🐾',
            q:'A photographer is a person who…',
            opts:['…plays soccer ⚽','…takes photos 📷','…cooks food 🍳'], correct:1 },
          { n:2, word:'📸 camera', bg:'studio', hint:'Tap the camera!',
            msg:'A <b>camera</b> captures what we see — and saves it forever! ✨',
            q:'What does a camera do?',
            opts:['Makes music 🎵','Takes photos 📷','Cooks food 🍳'], correct:1 },
          { n:3, word:'🎯 hobby', bg:'park', hint:'Light up each tile!',
            msg:'All of these are <b>hobbies</b> — things people ENJOY doing! 🌟',
            q:'A hobby is something you…',
            opts:['…must do for school 📝','…enjoy in your free time 🎯','…hate doing 😡'], correct:1 },
          { n:4, word:'💡 interesting', bg:'split', hint:'Tap both boxes!', msg:'',
            q:'If something is "interesting", you want to…',
            opts:['…close your eyes 😴','…learn more or watch longer ⭐','…leave the room 🚪'], correct:1 }
        ];

        let html = '<p style="background:var(--green-l);border:2px solid var(--green);border-radius:13px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--green-d);margin-bottom:14px">💬 4 interactive scenes! Tap each one and answer the quick check to unlock it.</p>';
        const initCnt = [1,2,3,4].filter(i => api.load('scene-'+i, false)).length;
        html += `<div style="background:#fff;border:2px solid var(--border);border-radius:13px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:10px"><span><b id="m2-cnt">${initCnt}</b> / 4 scenes complete</span><span style="font-size:12px;color:var(--ink-3)">Need all 4 ✓</span></div>`;

        defs.forEach(d => {
          const done = api.load('scene-'+d.n, false);
          html += `<div class="sc-card${done?' done':''}" id="sc${d.n}"><div class="sc-head"><div class="sc-num">${d.n}</div><div class="sc-word">${d.word}</div><div class="sc-tick">✓</div></div>`;
          if (d.bg === 'split') {
            html += `<div class="sc-stage split"><div class="sp-box boring" id="sc${d.n}-boring" onclick="spTap(${d.n},'boring')"><div style="font-size:48px">🕐</div><div style="font-size:13px;font-weight:800">A long slow clock</div><div class="sp-ver">😴 BORING</div></div><div class="sp-box fun" id="sc${d.n}-fun" onclick="spTap(${d.n},'fun')"><div style="font-size:48px">📦</div><div style="font-size:13px;font-weight:800">A surprise treasure!</div><div class="sp-ver">⭐ INTERESTING!</div></div></div>`;
          } else if (d.bg === 'park') {
            const hobbies = [['⚽','soccer'],['📷','photo'],['🎸','music'],['🎨','art'],['🎮','gaming'],['📚','reading']];
            html += `<div class="sc-stage park" style="height:200px"><div class="sc-hint">🖱️ ${d.hint}</div><div style="display:flex;flex-wrap:wrap;gap:6px;padding:14px;align-content:center;height:100%;width:100%">`;
            hobbies.forEach(([em,lb]) => { html += `<div class="htile" onclick="s3Tile(this,event)">${em}<div class="htile-lb">${lb}</div></div>`; });
            html += `</div><div class="sc-msg" id="sc${d.n}-msg">${d.msg}</div></div>`;
          } else {
            html += `<div class="sc-stage ${d.bg}" onclick="s${d.n}Play()"><div class="sc-hint">🖱️ ${d.hint}</div>`;
            if (d.n === 1) html += `<div style="position:absolute;font-size:54px;left:18%;bottom:25%">📸</div><div style="position:absolute;font-size:36px;left:32%;bottom:40%;opacity:0;transition:all .5s" id="s1cam">📷</div><div style="position:absolute;font-size:62px;right:-25%;bottom:20%;transition:right 1.2s cubic-bezier(.5,1.5,.5,1)" id="s1bear">🐻‍❄️</div><div style="position:absolute;inset:0;background:radial-gradient(circle at 35% 50%,#fff,transparent 40%);opacity:0;pointer-events:none;transition:opacity .15s" id="s1flash"></div>`;
            if (d.n === 2) html += `<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:80px" id="s2cam">📷</div><div style="position:absolute;right:-200px;top:50%;transform:translateY(-50%);background:#fff;width:90px;height:110px;border-radius:4px;padding:6px 6px 14px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:right 1s ease" id="s2pol"><div style="width:100%;height:100%;background:linear-gradient(180deg,#7DD3FC,#86EFAC);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:36px">🐻‍❄️</div></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff,transparent 40%);opacity:0;pointer-events:none;transition:opacity .15s" id="s2flash"></div>`;
            html += `<div class="sc-msg" id="sc${d.n}-msg">${d.msg}</div></div>`;
          }
          if (!done) {
            html += `<div class="sc-qc" id="sc${d.n}-qc"><div style="font-size:14px;font-weight:800;margin-bottom:8px">${d.q}</div><div style="display:flex;flex-direction:column;gap:7px">`;
            d.opts.forEach((o, oi) => { html += `<button class="opt" style="text-align:left;padding:10px 14px;font-size:14px" onclick="scAns(${d.n},this,${oi===d.correct})">${o}</button>`; });
            html += `</div></div>`;
          }
          html += '</div>';
        });

        el.innerHTML = html;

        window.s1Play = function() {
          const st = document.querySelector('#sc1 .sc-stage'); if (!st || st.dataset.p) return; st.dataset.p = '1';
          const flash = document.getElementById('s1flash'), cam = document.getElementById('s1cam'), bear = document.getElementById('s1bear'), msg = document.getElementById('sc1-msg');
          if (cam) cam.style.opacity = '1';
          if (flash) { setTimeout(()=>{flash.style.opacity='.9';setTimeout(()=>flash.style.opacity='0',300)},400); }
          if (bear) setTimeout(()=>bear.style.right='14%',900);
          if (msg) setTimeout(()=>msg.classList.add('show'),1800);
        };
        window.s2Play = function() {
          const st = document.querySelector('#sc2 .sc-stage'); if (!st || st.dataset.p) return; st.dataset.p = '1';
          const cam = document.getElementById('s2cam'), pol = document.getElementById('s2pol'), flash = document.getElementById('s2flash'), msg = document.getElementById('sc2-msg');
          if (cam) cam.style.animation = 'camshake .4s';
          if (flash) { setTimeout(()=>{flash.style.opacity='.9';setTimeout(()=>flash.style.opacity='0',300)},200); }
          if (pol) setTimeout(()=>pol.style.right='14%',700);
          if (msg) setTimeout(()=>msg.classList.add('show'),1500);
        };
        window.s3Tile = function(tile, e) {
          e.stopPropagation();
          if (tile.classList.contains('lit')) return;
          tile.classList.add('lit');
          if (document.querySelectorAll('.htile.lit').length >= 6) {
            const msg = document.getElementById('sc3-msg'); if (msg) msg.classList.add('show');
          }
        };
        window.spTap = function(n, which) {
          const box = document.getElementById('sc'+n+'-'+which); if (box) box.classList.add('shown');
        };
        window.scAns = function(n, btn, isCorrect) {
          const opts = btn.parentElement.querySelectorAll('.opt');
          if (Array.from(opts).some(o => o.disabled)) return;
          if (isCorrect) {
            btn.classList.add('correct');
            opts.forEach(o => o.disabled = true);
            document.getElementById('sc'+n).classList.add('done');
            const qc = document.getElementById('sc'+n+'-qc'); if (qc) qc.style.display = 'none';
            api.save('scene-'+n, true);
            const cnt = [1,2,3,4].filter(i => api.load('scene-'+i, false)).length;
            const cEl = document.getElementById('m2-cnt'); if (cEl) cEl.textContent = cnt;
            if (cnt >= 4) api.complete('What Is a Hobby?');
          } else {
            btn.classList.add('wrong');
            setTimeout(() => btn.classList.remove('wrong'), 700);
          }
        };
      },
      review(api) {
        const done = [1,2,3,4].filter(i => api.load('scene-'+i, false)).length;
        return done ? `<div class="rv-card"><div class="rv-lbl">WHAT IS A HOBBY?</div><div class="rv-val">${done}/4 scenes completed ✓</div></div>` : '';
      }
    },

    /* ── M3: Photo Explorer ──────────────────────────────────────────── */
    {
      id: 'm3', type: 'custom', icon: '📸', title: 'Photo Explorer',
      sub: '3 questions about the polar bear photo',
      render(el, api) {
        const QS = [
          { n:1, q:'What do you SEE in this photo?', em:'🐻‍❄️ + 📷 + ❄️',
            a:'A polar bear 🐻‍❄️, a camera 📷, a tripod 🎚️, ice and snow ❄️, and snowy mountains in the background 🏔️' },
          { n:2, q:'What is the polar bear DOING?', em:'🤔📸',
            a:"It LOOKS like the polar bear is taking photos! 📸 But really — it's just very curious about the camera. Polar bears are smart animals! 🐾" },
          { n:3, q:'Where is the PERSON who owns the camera?', em:'👀💨',
            a:"Far away! 🏃 It's very dangerous to be close to a polar bear. Wildlife photographers use special zoom cameras to take photos safely from a distance." }
        ];
        const initCnt = QS.filter(q => api.load('q'+q.n, false)).length;
        let html = '<p style="background:var(--green-l);border:2px solid var(--green);border-radius:13px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--green-d);margin-bottom:14px">💬 Look at the polar bear photo! Talk through each question with Dad before you tap to reveal the answer.</p>';
        html += '<div style="background:#fff;padding:8px 8px 16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);margin:0 auto 14px;max-width:280px">';
        html += '<div style="background:linear-gradient(180deg,#1E40AF 0%,#1E293B 35%,#F0F9FF 100%);aspect-ratio:4/3;border-radius:4px;position:relative;overflow:hidden">';
        html += '<span style="position:absolute;left:14%;bottom:8%;font-size:48px">🐻‍❄️</span><span style="position:absolute;right:18%;bottom:14%;font-size:32px">📷</span><span style="position:absolute;right:22%;bottom:5%;font-size:22px">🎚️</span>';
        html += '<div style="position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(180deg,transparent,#F0F9FF 75%)"></div></div>';
        html += '<p style="text-align:center;font-size:12px;color:#475569;font-weight:700;margin-top:8px">Svalbard, Norway · A curious polar bear meets a camera 📷🐾</p></div>';
        html += `<div style="background:#fff;border:2px solid var(--border);border-radius:13px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:10px"><span><b id="m3-cnt">${initCnt}</b> / 3 questions explored</span><span style="font-size:12px;color:var(--ink-3)">Open all 3 ✓</span></div>`;
        QS.forEach(q => {
          const opened = api.load('q'+q.n, false);
          html += `<div id="pq${q.n}" style="background:#fff;border:2px solid ${opened?'var(--green)':'var(--border)'};border-radius:13px;overflow:hidden;margin-bottom:8px">
            <div onclick="pqOpen(${q.n})" style="padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer">
              <div style="background:var(--green);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0">${q.n}</div>
              <div style="font-size:15px;font-weight:800;flex:1">${q.q}</div>
              <div id="pq${q.n}-arr" style="color:var(--ink-3);transition:transform .25s;transform:${opened?'rotate(180deg)':'none'}">▼</div>
            </div>
            <div id="pq${q.n}-body" style="display:${opened?'block':'none'};padding:12px 14px;background:var(--green-l);border-top:1px dashed var(--green)">
              <div style="text-align:center;font-size:1.8rem;margin-bottom:6px">${q.em}</div>
              <div style="font-size:14px;font-weight:700;color:var(--green-d);line-height:1.55">${q.a}</div>
            </div>
          </div>`;
        });
        el.innerHTML = html;

        window.pqOpen = function(n) {
          if (api.isReview) return;
          document.getElementById('pq'+n).style.borderColor = 'var(--green)';
          document.getElementById('pq'+n+'-body').style.display = 'block';
          document.getElementById('pq'+n+'-arr').style.transform = 'rotate(180deg)';
          api.save('q'+n, true);
          const cnt = [1,2,3].filter(i => api.load('q'+i, false)).length;
          const cEl = document.getElementById('m3-cnt'); if (cEl) cEl.textContent = cnt;
          if (cnt >= 3) api.complete('Photo Explorer');
        };
      },
      review(api) {
        const done = [1,2,3].filter(i => api.load('q'+i, false)).length;
        return done ? `<div class="rv-card"><div class="rv-lbl">PHOTO EXPLORER</div><div class="rv-val">${done}/3 questions explored ✓</div></div>` : '';
      }
    },

    /* ── M4: Look and Check ──────────────────────────────────────────── */
    {
      id: 'm4', type: 'quiz', icon: '✔', title: 'Look and Check',
      sub: 'Who is taking the photo? 3 options',
      passMark: 100,
      passMsg: "🎉 YES! The photographer is named Roie Galitz — he works in the Arctic! 📷❄️",
      tryMsg: "Look carefully — who would be USING the camera? Have another try! 📷",
      questions: [
        { q: 'Look at the polar bear photo. Who is TAKING the photo?',
          options: ['📷 a photographer', '🥾 a hiker', '🐻‍❄️ a polar bear'],
          answer: 0 }
      ]
    },

    /* ── M5: Write Your Caption ──────────────────────────────────────── */
    {
      id: 'm5', type: 'writing', icon: '✍️', title: 'Write Your Caption',
      sub: 'Describe the polar bear photo',
      prompt: 'Write ONE good sentence as a caption for the polar bear photo.\n\nAdjectives you can use:\n• About the BEAR: curious · huge · playful · Arctic · white\n• About the HOBBY: adventurous · dangerous · exciting · interesting\n\n🪄 Starters: "A curious polar bear…" · "This photo shows…" · "Wildlife photography is…"',
      placeholder: 'A curious polar bear…'
    },

    /* ── M6: Hobby or Not? ───────────────────────────────────────────── */
    {
      id: 'm6', type: 'truefalse', icon: '🎯', title: 'Hobby or Not?',
      sub: '5 activities — hobby or not?',
      statements: [
        { text: '📷 Taking photos of animals is a hobby', answer: true },
        { text: '😴 Sleeping all afternoon is a hobby', answer: false },
        { text: '🦴 Collecting dinosaur fossils is a hobby', answer: true },
        { text: '🧹 Cleaning your room is a hobby', answer: false },
        { text: '⚽ Watching Premier League games is a hobby', answer: true }
      ]
    },

    /* ── M7: Can Leo Score? ──────────────────────────────────────────── */
    {
      id: 'm7', type: 'quiz', icon: '⚽', title: 'Can Leo Score?',
      sub: '5-question final quiz — need 80%!',
      passMark: 80,
      passMsg: "⚽ GOAL! Brilliant work, Leo! You're ready for Vocabulary 1!",
      tryMsg: "Don't worry — tap ↺ Redo and try again!",
      questions: [
        { q: 'What is a HOBBY? 🎯',
          options: ['A homework assignment', 'Something you enjoy doing in your free time', 'A type of sport only'],
          answer: 1 },
        { q: 'Where was the famous polar bear photo taken? 🌍',
          options: ['Brazil 🇧🇷', 'Greenland 🇬🇱', 'Japan 🇯🇵'],
          answer: 1 },
        { q: 'Who is Roie Galitz?',
          options: ['A famous soccer player ⚽', 'A wildlife photographer 📷', 'A polar bear scientist 🐻‍❄️'],
          answer: 1 },
        { q: 'Which of these is INTERESTING? 💡',
          options: ["Watching paint dry on a wall 🎨", "Watching Haaland score his 26th Premier League goal ⚽", "Counting all your socks 🧦"],
          answer: 1 },
