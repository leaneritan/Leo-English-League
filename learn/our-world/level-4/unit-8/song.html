<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song · What's Your Hobby? — Leo's App 🎵</title>

<!-- Supabase + LEEA Cloud + Engine (repo paths; degrade gracefully if absent) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../../lib/leea-cloud-config.js"></script>
<script src="../../../../lib/leea-cloud.js"></script>
<script src="../../../../lib/leea-engine.js"></script>
</head>
<body>
<script>
LEEA.lesson({
  id: 'leo-4-8-song',
  titleIcon: '🎵',
  title: "What's Your Hobby?",
  subtitle: 'Unit 8 · Song · Leo’s practice',
  reviewSubtitle: 'Unit 8 · Song · What’s Your Hobby?',
  theme: 'green',
  modules: [

    /* ---- m1 · Karaoke (tap the green words) ---- */
    { id:'m1', type:'karaoke', icon:'🎵', title:'Listen & Sing', sub:'Tap the hobby words as you sing',
      intro:'Tap the green words while you sing! 🎤',
      sections:[
        { label:'Chorus 🔁', cls:'cho', lines:["What's your hobby?","What do you like to do?","What's your hobby?","I have a hobby, too!"] },
        { label:'Verse 1 📜', lines:[
          "The boy who has the highest *score* wins the video game.",
          "The girl who *collects* a *fossil* wants to learn its name.",
          "Who *enjoys* a *comic book*?",
          "Who likes to *compete*?",
          "I *collect* *stuffed animals* because I think they're sweet." ] },
        { label:'Chorus 🔁', cls:'cho', lines:["What's your hobby?","What do you like to do?","What's your hobby?","I have a hobby, too!"] },
        { label:'Verse 2 📜', lines:[
          "The boy who *takes a photo* sees it on the *screen*.",
          "The girl who reads about *dinosaurs* can see them in her dreams.",
          "Do you like to *cooperate*?",
          "Do you like to work *alone*?",
          "I like to talk about my hobby on my new cell phone." ] },
        { label:'Bridge 🎶', lines:[
          "It's fun to be *creative* and show what you can do.",
          "*Collect*, *compete*, *cooperate*.",
          "I have a hobby. Do you?" ] },
        { label:'Chorus 🔁', cls:'cho', lines:["What's your hobby?","What do you like to do?","What's your hobby?","I have a hobby, too!"] }
      ] },

    /* ---- m2 · Song Words flashcards ---- */
    { id:'m2', type:'flashcards', icon:'🆕', title:'Song Words', sub:'chorus · verse · rhyme',
      cards:[
        { word:"chorus", emoji:"🔁", ipa:"/ˈkɔːrəs/", ja:"サビ", jaen:"the part of a song that repeats",
          def:"A chorus = the part of a song that repeats. We sing it again and again.",
          game:{type:"pick", q:"Which part do we sing <b>again and again</b>?", opts:["The Chorus","Verse 1","The Bridge"], correct:0} },
        { word:"verse", emoji:"📜", ipa:"/vɜːrs/", ja:"バース", jaen:"the story part of a song",
          def:"A verse = a part of a song that tells the story. Each verse is different.",
          game:{type:"pick", q:"Which part <b>tells the story</b> and changes each time?", opts:["The Chorus","A Verse"], correct:1} },
        { word:"rhyme", emoji:"🎶", ipa:"/raɪm/", ja:"韻（いん）", jaen:"words that end with the same sound",
          def:"Rhyme = words that end with the same sound, like do and too.",
          game:{type:"pick", q:"Which word <b>rhymes</b> with <b>do</b>?", opts:["too","book","game"], correct:0} }
      ] },

    /* ---- ma · Academic words ---- */
    { id:'ma', type:'flashcards', icon:'🎓', title:'Academic Words', sub:'Tricky words we keep strong',
      cards:[
        { word:"analyze", emoji:"🔬🔎", ipa:"/ˈænəlaɪz/", ja:"分析する（ぶんせきする）", jaen:"look closely to understand", def:"Analyze = to look at something carefully to understand it.",
          game:{type:"pick", q:"What do you do when you <b>analyze</b> a song?", opts:["look at it carefully to understand it","throw it away","sing it very fast"], correct:0} },
        { word:"describe", emoji:"👀🗣️", ipa:"/dɪˈskraɪb/", ja:"描写する（びょうしゃする）", jaen:"say what something is like", def:"Describe = to say what something is like.",
          game:{type:"tf", s:"If you <b>describe</b> your hobby, you say what it is like.", a:true} },
        { word:"explain", emoji:"💡🗯️", ipa:"/ɪkˈspleɪn/", ja:"説明する（せつめいする）", jaen:"tell how or why", def:"Explain = to tell how or why something happens.",
          game:{type:"gap", before:"Please", after:"how to play the game.", chips:["explain","analyze","collect"], a:"explain"} },
        { word:"caption", emoji:"🏷️📸", ipa:"/ˈkæpʃən/", ja:"キャプション（写真の説明）", jaen:"the words under a photo", def:"A caption = the words under a photo that tell about it.",
          game:{type:"pick", q:"What is a <b>caption</b>?", opts:["the words under a photo","a kind of ball","a loud song"], correct:0} }
      ] },

    /* ---- m3 · Word Review (13 games) ---- */
    { id:'m3', type:'flashcards', icon:'🔤', title:'Word Review', sub:'13 quick word games',
      cards:[
        { word:"score", emoji:"📊🏅", ipa:"/skɔːr/", ja:"得点（とくてん）", jaen:"the points you have in a game", def:"Your score = the number of points you have in a game.",
          game:{type:"lyric", q:"Tap the line where you hear <b>score</b>.", lines:["The boy who has the highest score wins the video game.","Who enjoys a comic book?","I have a hobby, too!"], correct:0} },
        { word:"collect", emoji:"🗂️🪙", ipa:"/kəˈlɛkt/", ja:"集める（あつめる）", jaen:"to keep things you like together", def:"Collect = to bring together things you like and keep them.",
          game:{type:"tf", s:"In the song, the singer says “I collect stuffed animals.”", a:true} },
        { word:"enjoy", emoji:"😄🎉", ipa:"/ɪnˈdʒɔɪ/", ja:"楽しむ（たのしむ）", jaen:"to like doing something", def:"Enjoy = to like doing something and feel happy.",
          game:{type:"gap", before:"Who", after:"a comic book?", chips:["enjoys","collects","takes"], a:"enjoys"} },
        { word:"compete", emoji:"🏆⚔️", ipa:"/kəmˈpiːt/", ja:"競争する（きょうそうする）", jaen:"to try to win", def:"Compete = to try to win against other people.",
          game:{type:"pick", q:"What does <b>compete</b> mean?", opts:["to try to win","to fall asleep","to draw"], correct:0} },
        { word:"take photos", emoji:"📸🌿", ipa:"/teɪk ˈfoʊtoʊz/", ja:"写真をとる（しゃしんをとる）", jaen:"to make pictures with a camera", def:"Take photos = to use a camera to make pictures.",
          game:{type:"scramble", q:"Put the words in order.", pieces:["photos","take"], a:"take photos"} },
        { word:"a screen", emoji:"📺🖥️", ipa:"/skriːn/", ja:"画面（がめん）", jaen:"the flat part of a phone or TV", def:"A screen = the flat glass part where you see pictures.",
          game:{type:"tf", s:"A screen is the flat part of a phone or TV where you see pictures.", a:true} },
        { word:"cooperate", emoji:"🤜🤛", ipa:"/koʊˈɒpəreɪt/", ja:"協力する（きょうりょくする）", jaen:"to work together", def:"Cooperate = to work together with other people.",
          game:{type:"gap", before:"Do you like to", after:"with your team?", chips:["cooperate","compete","collect"], a:"cooperate"} },
        { word:"alone", emoji:"🧍🔇", ipa:"/əˈloʊn/", ja:"ひとりで", jaen:"by yourself", def:"Alone = by yourself, with no other people.",
          game:{type:"pick", q:"Which one means <b>alone</b>?", opts:["by yourself","with friends","very fast"], correct:0} },
        { word:"creative", emoji:"🎨💡", ipa:"/kriˈeɪtɪv/", ja:"創造的な（そうぞうてきな）", jaen:"good at making new things", def:"Creative = good at making new and interesting things.",
          game:{type:"lyric", q:"Tap the line where you hear <b>creative</b>.", lines:["Who likes to compete?","It's fun to be creative and show what you can do.","I have a hobby, too!"], correct:1} },
        { word:"a fossil", emoji:"🦴🪨", ipa:"/ˈfɒsəl/", ja:"化石（かせき）", jaen:"the old shape of an animal in rock", def:"A fossil = the old shape of an animal or plant, kept in rock for a long time.",
          game:{type:"tf", s:"A fossil is a very old shape of a plant or animal in rock.", a:true} },
        { word:"a comic book", emoji:"📖💥", ipa:"/ˈkɒmɪk bʊk/", ja:"漫画（まんが）", jaen:"a book that tells a story with pictures", def:"A comic book = a book that tells a story with pictures.",
          game:{type:"gap", before:"I like to read a", after:"about superheroes.", chips:["comic book","fossil","screen"], a:"comic book"} },
        { word:"a stuffed animal", emoji:"🧸❤️", ipa:"/stʌft ˈænɪməl/", ja:"ぬいぐるみ", jaen:"a soft toy animal", def:"A stuffed animal = a soft toy animal you can hug.",
          game:{type:"pick", q:"Which one is a <b>stuffed animal</b>?", opts:["a soft toy bear","a real fish","a fast car"], correct:0} },
        { word:"a dinosaur", emoji:"🦕🦖", ipa:"/ˈdaɪnəsɔːr/", ja:"恐竜（きょうりゅう）", jaen:"a big animal from long ago", def:"A dinosaur = a very big animal that lived a long, long time ago.",
          game:{type:"scramble", q:"Build the word.", pieces:["no","di","saur"], a:"dinosaur", join:""} }
      ] },

    /* ---- m4 · Use It Again (custom escape-hatch block) ---- */
    { id:'m4', type:'custom', icon:'🔁', title:'Use It Again', sub:'Swap words + a peek at who',
      render(el, api){
        const reveals = [
          {q:"Who wins the video game?", a:"the boy <b>who</b> has the highest score"},
          {q:"Who can see dinosaurs in dreams?", a:"the girl <b>who</b> reads about dinosaurs"},
          {q:"⚽ Who won the Bundesliga Golden Boot?", a:"Harry Kane, <b>who</b> scored 33 goals"}
        ];
        const sw1 = api.load('sw1', 'cooperate'), sw2 = api.load('sw2', 'alone');
        el.innerHTML = `
          <div class="note" style="margin:0 0 14px;font-size:14px">Swap the song words for their opposites, then peek at the little word <b>who</b>.</div>
          <div class="fcard"><div class="slotline">Do you like to <span class="slot" id="sw1">${sw1}</span>?</div>
            <div class="chips"><button class="chip" data-sw="1" data-ok="1">compete</button><button class="chip" data-sw="1" data-ok="0">enjoy</button><button class="chip" data-sw="1" data-ok="0">collect</button></div></div>
          <div class="fcard"><div class="slotline">Do you like to work <span class="slot" id="sw2">${sw2}</span>?</div>
            <div class="chips"><button class="chip" data-sw="2" data-ok="1">together</button><button class="chip" data-sw="2" data-ok="0">creative</button><button class="chip" data-sw="2" data-ok="0">score</button></div></div>
          <div class="fb ok" id="swfb"></div>
          <div class="klabel">A peek at “who” 👀 — tap to see</div>
          ${reveals.map((w,i)=>`<div class="prog-row" id="who${i}" style="cursor:pointer"><div class="pn">${w.q}</div><div class="pn" style="text-align:right;color:var(--green-d);opacity:${api.isReview?1:0}" id="wa${i}">${w.a}</div></div>`).join('')}`;
        if (api.isReview) return;
        el.querySelectorAll('[data-sw]').forEach(c => c.onclick = () => {
          const g = c.dataset.sw, fb = el.querySelector('#swfb');
          if (c.dataset.ok === '1') {
            el.querySelector('#sw'+g).textContent = c.textContent;
            api.save('sw'+g, c.textContent);
            el.querySelectorAll('[data-sw="'+g+'"]').forEach(x => x.classList.add('used'));
            c.classList.remove('used'); c.style.background = 'var(--green)'; c.style.color = '#fff';
            fb.textContent = 'Nice swap! Sing the new line. 🎶';
          } else { c.style.background = '#fee2e2'; setTimeout(()=>c.style.background='', 500); }
        });
        reveals.forEach((_,i) => { const r = el.querySelector('#who'+i); if (r) r.onclick = () => { const a = el.querySelector('#wa'+i); if (a) a.style.opacity = 1; }; });
      },
      review(api){
        const sw1 = api.load('sw1', null), sw2 = api.load('sw2', null);
        if (!sw1 && !sw2) return '';
        return '<div class="rv-card"><div class="rv-lbl">Use It Again — Leo’s swaps</div><div class="rv-val">Do you like to ' +
          (sw1||'___') + '?\nDo you like to work ' + (sw2||'___') + '?</div></div>';
      }
    },

    /* ---- m5 · Write a Line (builder; the built line shows in review) ---- */
    { id:'m5', type:'builder', icon:'✍️', title:'Write a Line', sub:'Make your own song line',
      model:'"I <b>collect stuffed animals</b> because I think they’re <b>sweet</b>."',
      rows:[
        { prefix:'I', options:['collect soccer cards','take photos','read comic books'] },
        { prefix:'because', suffix:'.', options:['they are cool','it is fun','I love them'] }
      ] },

    /* ---- m6 · Quiz ---- */
    { id:'m6', type:'quiz', icon:'🧠', title:'Quiz', sub:'Show what you know', passMark:80,
      passMsg:'Amazing singing brain, Leo!', tryMsg:'Let’s sing the song again together. You’ve got this!',
      questions:[
        {q:"What do we call the part of a song that <b>repeats</b>?", options:["chorus","verse","rhyme"], answer:0},
        {q:"Which part of a song <b>tells the story</b> and changes each time?", options:["verse","chorus","score"], answer:0},
        {q:"Words that end with the <b>same sound</b>, like do and too, are a...", options:["rhyme","fossil","screen"], answer:0},
        {q:"What is our song called?", options:["What's Your Hobby?","What's Your Name?","What Time Is It?"], answer:0},
        {q:"Harry Kane had the highest ___ in the Bundesliga — 33 goals.", options:["score","screen","dinosaur"], answer:0},
        {q:"To <b>work together</b> with other people is to ___.", options:["cooperate","compete","collect"], answer:0},
        {q:"A soft toy animal you can hug is a ___.", options:["stuffed animal","fossil","comic book"], answer:0},
        {q:"The old shape of an animal kept in rock is a ___.", options:["fossil","dinosaur","screen"], answer:0}
      ] },

    /* ---- m7 · My Progress (auto dashboard) ---- */
    { id:'m7', type:'dashboard', icon:'📊', title:'My Progress', sub:'See everything you finished', wide:true,
      footnote:"Keep singing “What's Your Hobby?” 🎶" }
  ]
});
</script>
</body>
</html>
