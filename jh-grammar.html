<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar — Leo's English Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --nc:#2E7D32;--nc-mid:#388E3C;--nc-light:#4CAF50;
      --nc-pale:#E8F5E9;--nc-xpale:#F1F8F1;--navy:#1B5E20;
      --gold:#F9A825;--orange:#E65100;--brown:#6D4C41;
      --red:#C62828;--dark:#1A1A2E;--mid:#4A4A6A;--light:#7A7A9A;
      --bg:#F4FBF4;--white:#fff;
      --shadow:0 2px 12px rgba(46,125,50,.10);
      --shadow-lg:0 6px 24px rgba(46,125,50,.15);
      --r:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}

    .hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--nc) 65%,var(--nc-light) 100%);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.2)}
    .back-btn,.top-btn{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:50px;padding:6px 14px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;transition:background .15s;white-space:nowrap}
    .back-btn:hover,.top-btn:hover{background:rgba(255,255,255,.25)}
    .top-btn.on{background:#fff;color:var(--nc);border-color:#fff}
    .hdr-info{flex:1;min-width:0}
    .hdr-title{font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hdr-sub{font-size:11px;opacity:.86;font-weight:700}
    .hdr-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .score-top{font-weight:900;font-size:13px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);border-radius:50px;padding:6px 10px}

    .wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
    .card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);border:1.5px solid var(--nc-pale);padding:16px;margin-bottom:14px}
    .card:hover{box-shadow:var(--shadow-lg)}
    .banner{background:linear-gradient(135deg,var(--nc-pale),var(--nc-xpale));border:2px solid #C8E6C9}
    .cando-jp{font-family:'Baloo 2',cursive;font-size:24px;line-height:1.15;font-weight:800;color:var(--navy)}
    .en{display:none;color:var(--mid);font-size:13px;font-weight:700;margin-top:4px;line-height:1.45}
    .show-en .en{display:block}
    .section-title{font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;color:var(--navy);margin:20px 0 10px}
    .section-bar{border-radius:14px;padding:10px 14px;color:#fff;font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;margin:20px 0 12px;box-shadow:var(--shadow)}
    .section-a{background:linear-gradient(135deg,#E65100,#F4511E)}
    .section-b{background:linear-gradient(135deg,#5D4037,#8D6E63)}

    .key-item{padding:10px 0;border-bottom:1px solid var(--nc-pale)}
    .key-item:last-child{border-bottom:none}
    .key-en{font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:var(--nc)}
    .jp{color:var(--mid);font-size:14px;font-weight:700;line-height:1.55;margin-top:4px;white-space:pre-line}
    .point{border:2px solid var(--nc);background:#fff}
    .point-head{font-family:'Baloo 2',cursive;font-size:21px;font-weight:800;color:var(--navy);margin-bottom:10px}
    .point-item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--nc-pale)}
    .num{width:32px;height:32px;border-radius:50%;background:var(--nc);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .item-title{font-weight:900;color:var(--dark)}

    .ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .ex-title{font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:var(--navy)}
    .track{font-size:12px;font-weight:900;color:var(--nc);background:var(--nc-pale);border-radius:50px;padding:4px 10px;white-space:nowrap}
    .muted{font-size:13px;color:var(--light);font-weight:700;margin-bottom:12px;line-height:1.5}
    .scene-grid,.choice-grid,.bank,.answer{display:flex;flex-wrap:wrap;gap:8px}
    .choice-grid{margin-bottom:12px}
    .scene,.choice,.tile,.answer-tile{border:2px solid var(--nc-pale);background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;transition:all .15s;font-family:'Nunito',sans-serif;font-size:14px}
    .scene{min-width:130px;background:var(--nc-xpale)}
    .choice{flex:1;min-width:180px;text-align:left}
    .scene.sel,.choice.sel,.tile.sel{border-color:var(--gold);background:#FFF8E1}
    .scene.ok,.choice.ok,.tile.ok,.slot.ok{border-color:var(--nc);background:var(--nc-pale);color:var(--navy)}
    .scene.no,.choice.no,.tile.no,.slot.no{border-color:#EF5350;background:#FFEBEE;color:#C62828}
    .tile.used{opacity:.35;pointer-events:none}
    .answer{min-height:48px;border:2px dashed #A5D6A7;background:var(--nc-xpale);border-radius:12px;padding:8px;margin:10px 0}
    .answer-tile{background:var(--nc);color:#fff;border-color:var(--nc)}
    .slot{display:inline-flex;align-items:center;justify-content:center;min-width:74px;min-height:30px;vertical-align:middle;border:2px dashed #A5D6A7;border-radius:8px;background:#fff;margin:2px 4px;padding:4px 8px;text-align:center}
    .btn{background:var(--nc);border:none;color:#fff;border-radius:50px;padding:8px 18px;font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;cursor:pointer;box-shadow:var(--shadow)}
    .btn.alt{background:#E0E0E0;color:var(--mid)}
    .btn:hover{filter:brightness(.96)}
    .result{display:none;border-radius:10px;padding:10px 12px;font-weight:900;margin-top:10px}
    .result.ok{display:block;background:var(--nc-pale);color:var(--navy);border:1.5px solid #A5D6A7}
    .result.no{display:block;background:#FFEBEE;color:#C62828;border:1.5px solid #EF9A9A}

    .kotoba-card{background:#fff;border:1.5px solid var(--nc-pale);border-radius:14px;padding:12px;margin-bottom:10px}
    .badge{display:inline-block;background:var(--nc-pale);color:var(--nc);border-radius:50px;padding:2px 9px;font-size:11px;font-weight:900}
    .context,.refbox{background:#FAFAFA;border:1.5px solid #E8E8E8;border-radius:12px;padding:12px;margin-bottom:10px}
    .free-text{width:100%;min-height:130px;border:2px solid #C8E6C9;border-radius:14px;padding:12px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;outline:none;resize:vertical}
    .free-text:focus{border-color:var(--nc)}
    .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
    .empty,.err{text-align:center;padding:50px 20px;color:var(--light);font-weight:800}
    .err{color:#C62828}

    @media(max-width:620px){
      .hdr{padding:12px 10px;gap:8px}
      .hdr-title{font-size:17px}
      .score-top{display:none}
      .wrap{padding:14px 10px 50px}
      .card{padding:13px}
      .cando-jp{font-size:21px}
      .section-title{font-size:20px}
      .choice{min-width:100%}
    }
  </style>
</head>
<body>
<header class="hdr">
  <a href="junior-high.html" class="back-btn">← JH1</a>
  <div class="hdr-info">
    <div class="hdr-title" id="hdrTitle">Grammar</div>
    <div class="hdr-sub" id="hdrSub">Loading...</div>
  </div>
  <div class="hdr-r">
    <span class="score-top" id="overallScore">✓ 0/0</span>
    <button class="top-btn" id="enBtn" onclick="toggleEN()">JP</button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty">⏳ Loading grammar...</div>
</main>

<script>
const params = new URLSearchParams(location.search);
const unit = params.get('unit') || 'lesson-1';
const rawSet = params.get('set') || '1';
let set = rawSet === 'drill' ? 'drill' : parseInt(rawSet, 10);
const pathFor = s => {
  const filename = s === 'drill' ? 'drill.json' : `grammar-${s}.json`;
  return `content/new-crown/jh1/${unit}/${filename}`;
};

let data = null;
let enOn = localStorage.getItem('jh-grammar-en') === '1';
let scores = {};

const $ = q => document.querySelector(q);
const $$ = q => [...document.querySelectorAll(q)];
const A = x => Array.isArray(x) ? x : [];
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const field = (o, ...ks) => { for (const k of ks) if (o && o[k] != null) return o[k]; return ''; };
const norm = s => String(s || '').replace(/\s+([,.?!])/g,'$1').replace(/\s+/g,' ').trim().toLowerCase();
const answerString = o => {
  const a = field(o, 'answer', 'correct', 'correct_answer');
  return Array.isArray(a) ? a.join(' ') : String(a || '');
};
const hEN = t => t ? `<div class="en">${esc(t)}</div>` : '';
const nums = i => ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'][i] || String(i + 1);


function shuffleArray(arr) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function shuffledBank(words, correctSentence = '') {
  const original = words.slice();
  let shuffled = shuffleArray(original);
  const correct = norm(correctSentence);
  if (original.length > 1 && norm(shuffled.join(' ')) === correct) {
    shuffled = shuffleArray(original);
    if (norm(shuffled.join(' ')) === correct) {
      shuffled.push(shuffled.shift());
    }
  }
  return shuffled;
}

function exLabel(num, kind) {
  const map = {
    scene: '場面チェック',
    blank: '空欄を埋めよう',
    build: '並べかえよう',
    write: '自分で書いてみよう'
  };
  return `${nums(num - 1)} ${map[kind] || kind}`;
}


function makeSlots(n) {
  return Array.from({ length: Math.max(1, n) }, () => '<span class="slot"></span>').join(' ');
}

function fillTemplate(rawTemplate, answerCount) {
  const template = esc(rawTemplate);
  const blanks = template.match(/_{2,}|\[blank\]/gi) || [];

  if (!blanks.length) {
    return `${makeSlots(answerCount)} ${template}`;
  }

  if (blanks.length === 1 && answerCount > 1) {
    return template.replace(/_{2,}|\[blank\]/i, makeSlots(answerCount));
  }

  return template.replace(/_{2,}|\[blank\]/gi, () => '<span class="slot"></span>');
}

function sectionCorrectCount(sec) {
  return sec.querySelectorAll('.result.ok').length;
}

function refreshSectionScore(item) {
  const sec = item.closest('.ex');
  if (sec && scores[sec.id]) setScore(sec.id, sectionCorrectCount(sec), scores[sec.id].total);
}

function bankWords(o, fallbackAnswers = []) {
  let b = field(o, 'bank', 'word_bank', 'words', 'choices');
  if (!Array.isArray(b) || !b.length) b = fallbackAnswers;
  return A(b).map(x => typeof x === 'string' ? x : field(x, 'text', 'en', 'word', 'answer')).filter(Boolean);
}

function setScore(id, ok, total) {
  scores[id] = { ok, total };
  updateScores();
}

function initScore(id, total) {
  scores[id] = scores[id] || { ok: 0, total };
  scores[id].total = total;
}

function updateScores() {
  let ok = 0, total = 0;
  Object.values(scores).forEach(s => { ok += s.ok || 0; total += s.total || 0; });
  $('#overallScore').textContent = `✓ ${ok}/${total}`;
  $$('[data-track]').forEach(el => {
    const s = scores[el.dataset.track] || { ok: 0, total: 0 };
    el.textContent = `✓ ${s.ok}/${s.total}`;
  });
}

function toggleEN() {
  enOn = !enOn;
  localStorage.setItem('jh-grammar-en', enOn ? '1' : '0');
  document.body.classList.toggle('show-en', enOn);
  $('#enBtn').textContent = enOn ? 'EN' : 'JP';
  $('#enBtn').classList.toggle('on', enOn);
}

async function fetchJson(s) {
  const res = await fetch(pathFor(s));
  if (!res.ok) throw new Error('missing');
  return await res.json();
}

async function fileExists(s) {
  try {
    let res = await fetch(pathFor(s), { method: 'HEAD' });
    if (res.ok) return true;

    res = await fetch(pathFor(s), { cache: 'no-store' });
    return res.ok;
  } catch {
    return false;
  }
}

async function countSets() {
  let n = 0;
  for (let i = 1; i <= 20; i++) {
    if (await fileExists(i)) n = i;
    else if (i > 1) break;
  }
  return n;
}

function updateUrlSet(newSet) {
  const url = new URL(location.href);
  url.searchParams.set('unit', unit);
  url.searchParams.set('set', newSet);
  history.replaceState(null, '', url);
}

async function load() {
  document.body.classList.toggle('show-en', enOn);
  $('#enBtn').textContent = enOn ? 'EN' : 'JP';
  $('#enBtn').classList.toggle('on', enOn);

  const maxSet = await countSets();

  if (set === 'drill') {
    try {
      data = await fetchJson(set);
      render(maxSet || 0);
      return;
    } catch {
      $('#hdrSub').textContent = `${unit} · drill`;
      $('#app').innerHTML = `<div class="err">❌ Could not load ${esc(pathFor('drill'))}<br><br>Check the file path and JSON name.</div>`;
      return;
    }
  }

  if (!maxSet) {
    $('#hdrSub').textContent = `${unit} · set ${set}`;
    $('#app').innerHTML = `<div class="err">❌ No grammar JSON files found for ${esc(unit)}.<br><br>Expected files like ${esc(pathFor(1))}</div>`;
    return;
  }

  if (set < 1) set = 1;
  if (set > maxSet) {
    set = maxSet;
    updateUrlSet(set);
  }

  try {
    data = await fetchJson(set);
    render(maxSet);
  } catch {
    for (let fallback = Math.min(set - 1, maxSet); fallback >= 1; fallback--) {
      if (await fileExists(fallback)) {
        set = fallback;
        updateUrlSet(set);
        data = await fetchJson(set);
        render(maxSet);
        return;
      }
    }

    $('#hdrSub').textContent = `${unit} · set ${set}`;
    $('#app').innerHTML = `<div class="err">❌ Could not load ${esc(pathFor(set))}<br><br>Check the file path and JSON name.</div>`;
  }
}

function render(setCount) {
  scores = {};
  const lesson = field(data, 'lesson') || unit.replace('-', ' ');
  const cando = field(data, 'cando_num', 'cando_number', 'can_do_number', 'cando_no') || set;
  const isDrill = field(data, 'lesson') === 'drill' || field(data, 'cando_num') === 'ドリル';

  const pages = field(data, 'textbook_pages');
  $('#hdrTitle').textContent = isDrill ? '場面別ドリル' : `Lesson ${lesson} Grammar`;
  $('#hdrSub').textContent = isDrill
    ? 'Lessons 1〜3 · 自己紹介の表現'
    : `CAN-DO ${cando} · ${setCount} set${setCount === 1 ? '' : 's'} available${pages ? ` · 教科書 ${pages}` : ''}`;

  let html = `
    <section class="card banner">
      <div class="cando-jp">${esc(field(data, 'cando_jp', 'can_do_jp'))}</div>
      ${hEN(field(data, 'cando_en', 'can_do_en'))}
    </section>
  `;

  html += keySentences();
  html += pointBox();
  html += sectionA();

  if (data.hitsuyou_kotoba) html += hitsuyou();
  if (data.section_b) html += sectionB();

  html += `
    <div class="nav">
      <button class="btn alt" onclick="goSet(-1)">← Prev</button>
      <button class="btn" onclick="goSet(1)">Next →</button>
    </div>
  `;

  $('#app').innerHTML = html;
  bindAll();
  updateScores();
}

function keySentences() {
  const ks = A(data.kihon_bun);
  if (!ks.length) return '';
  return `
    <h2 class="section-title">基本文</h2>
    <section class="card">
      ${ks.map(x => `
        <div class="key-item">
          <div class="key-en">${esc(field(x, 'en', 'text'))}</div>
          <div class="jp">${esc(field(x, 'jp', 'ja'))}</div>
        </div>
      `).join('')}
    </section>
  `;
}

function pointBox() {
  const p = data.point || {};
  const items = A(p.items);
  if (!p.title_jp && !items.length) return '';
  return `
    <h2 class="section-title">ポイント</h2>
    <section class="card point">
      <div class="point-head">${esc(p.title_jp || 'Grammar Point')}</div>
      ${hEN(p.title_en)}
      ${items.map((it, i) => `
        <div class="point-item">
          <div class="num">${nums(i)}</div>
          <div>
            <div class="item-title">${esc(it.title_jp)}</div>
            ${hEN(it.title_en)}
            <div class="jp">${esc(it.body_jp)}</div>
            ${hEN(it.body_en)}
          </div>
        </div>
      `).join('')}
    </section>
  `;
}

function exCard(id, title, body, total, instructionJp = '', instructionEn = '') {
  initScore(id, total);
  return `
    <section class="card ex" id="${id}">
      <div class="ex-head">
        <div class="ex-title">${title}</div>
        <div class="track" data-track="${id}">✓ 0/${total}</div>
      </div>
      ${instructionJp ? `<div class="muted">${esc(instructionJp)}${hEN(instructionEn)}</div>` : ''}
      ${body}
    </section>
  `;
}

function sectionA() {
  const a = data.section_a || data.a || {};
  let html = '<div class="section-bar section-a">A — 基本を確認する！</div>';
  if (a.ex1) html += sceneCheck('a1', a.ex1, exLabel(1, 'scene'));
  if (a.ex2) html += fillBlank('a2', a.ex2, exLabel(2, 'blank'));
  if (a.ex3) html += buildEx('a3', a.ex3, exLabel(3, 'build'));
  return html;
}

function sectionB() {
  const b = data.section_b || {};
  let html = '<div class="section-bar section-b">B — 伝える練習をする！</div>';
  if (b.ex1) html += buildEx('b1', b.ex1, exLabel(1, 'build'));
  if (b.ex2) html += multiBuild('b2', b.ex2, exLabel(2, 'build'));
  if (b.ex3) html += freeWrite('b3', b.ex3, exLabel(3, 'write'));
  return html;
}

function sceneCheck(id, ex, title = exLabel(1, 'scene')) {
  const scenes = A(field(ex, 'scenes', 'labels')).slice(0, 3);
  const choices = A(field(ex, 'choices', 'sentences')).slice(0, 3);
  const body = `
    <div class="choice-grid">
      ${choices.map((c, i) => `
        <button class="choice" data-sc-choice="${i}" data-correct="${esc(field(c, 'correct_scene', 'scene_id', 'scene', 'match') || (i + 1))}">
          ${esc(field(c, 'en', 'text', 'sentence'))}
          ${hEN(field(c, 'jp', 'ja'))}
        </button>
      `).join('')}
    </div>
    <div class="scene-grid">
      ${scenes.map((s, i) => `
        <button class="scene" data-sc-scene="${esc(field(s, 'id') || (i + 1))}">
          ${esc(field(s, 'context_jp', 'label_jp', 'jp', 'label', 'text'))}
          ${hEN(field(s, 'context_en', 'label_en', 'en'))}
        </button>
      `).join('')}
    </div>
  `;
  return exCard(id, title, body, Math.min(scenes.length, choices.length), field(ex,'instruction_jp'), field(ex,'instruction_en'));
}

function fillBlank(id, ex, title = exLabel(2, 'blank')) {
  const items = A(field(ex, 'items', 'questions')).length ? A(field(ex, 'items', 'questions')) : [ex];
  const body = items.map((it, i) => {
    const bank = bankWords(it);
    const answers = A(field(it, 'answer', 'answers', 'blanks')).length ? A(field(it, 'answer', 'answers', 'blanks')) : [answerString(it)];
    const template = fillTemplate(field(it, 'en_template', 'template_en', 'template', 'en'), answers.length);
    return `
      <div class="fill-item" data-fill-item="${id}-${i}" data-answers="${esc(JSON.stringify(answers))}">
        <div class="jp">${esc(field(it, 'jp', 'sentence_jp'))}</div>
        <div class="key-en">${template}</div>
        <div class="bank">${bank.map(w => `<button class="tile" data-fill-tile>${esc(w)}</button>`).join('')}</div>
        <button class="btn" data-fill-check>Check ✓</button>
        <button class="btn alt" data-fill-reset>Reset</button>
        <div class="result"></div>
      </div>
    `;
  }).join('<hr style="border:0;border-top:1px solid var(--nc-pale);margin:14px 0">');
  return exCard(id, title, body, items.length, field(ex,'instruction_jp'), field(ex,'instruction_en'));
}

function buildEx(id, ex, title) {
  const items = A(field(ex, 'items', 'questions')).length ? A(field(ex, 'items', 'questions')) : [ex];
  return exCard(
    id,
    title,
    items.map((it, i) => oneBuild(`${id}-${i}`, it)).join('<hr style="border:0;border-top:1px solid var(--nc-pale);margin:14px 0">'),
    items.length,
    field(ex,'instruction_jp'),
    field(ex,'instruction_en')
  );
}

function oneBuild(id, it) {
  let bank = bankWords(it);
  if (!bank.length) bank = answerString(it).split(' ');
  return `
    <div class="build-item" data-build-item="${id}" data-correct="${esc(answerString(it))}">
      <div class="jp">${esc(field(it, 'jp', 'sentence_jp', 'cue_jp'))}</div>
      <div class="answer"></div>
      <div class="bank">${shuffledBank(bank, answerString(it)).map(w => `<button class="tile" data-build-tile>${esc(w)}</button>`).join('')}</div>
      <button class="btn" data-build-check>Check ✓</button>
      <button class="btn alt" data-build-reset>Reset</button>
      <div class="result"></div>
    </div>
  `;
}

function hitsuyou() {
  const hk = data.hitsuyou_kotoba || {};
  const items = A(hk.items || hk);
  if (!items.length) return '';
  const answers = items.map(x => field(x, 'answer', 'en', 'word')).filter(Boolean);
  return `
    <h2 class="section-title">必ず覚えたい語句</h2>
    ${exCard('kotoba', '語句チェック', `
      ${hk.instruction_jp ? `<div class="muted">${esc(hk.instruction_jp)}${hEN(hk.instruction_en)}</div>` : ''}
      ${items.map((it, i) => {
        const bank = shuffledBank(bankWords(it, answers));
        return `
          <div class="kotoba-card" data-kotoba-item="${i}" data-correct="${esc(field(it, 'answer', 'en', 'word'))}">
            <div><b>${esc(field(it, 'jp', 'ja'))}</b> <span class="badge">${esc(field(it, 'pos_jp', 'pos'))}</span></div>
            ${field(it, 'hint') ? `<div class="jp">Hint: ${esc(it.hint)}</div>` : ''}
            <div class="bank">${bank.map(w => `<button class="tile" data-kotoba-tile>${esc(w)}</button>`).join('')}</div>
            <div class="result"></div>
          </div>
        `;
      }).join('')}
    `, items.length)}
  `;
}

function multiBuild(id, ex, title = exLabel(2, 'build')) {
  const items = A(field(ex, 'items', 'questions'));
  const body = `
    <div class="context">
      <b>${esc(field(ex, 'context_jp'))}</b>
      ${hEN(field(ex, 'context_en'))}
    </div>
    ${items.map((it, i) => `
      <div>
        <div class="jp"><b>${esc(field(it, 'label_jp'))}</b>${hEN(field(it, 'label_en'))}</div>
        ${oneBuild(`${id}-${i}`, it)}
      </div>
    `).join('<hr style="border:0;border-top:1px solid var(--nc-pale);margin:14px 0">')}
  `;
  return exCard(id, title, body, items.length, field(ex,'instruction_jp'), field(ex,'instruction_en'));
}

function freeWrite(id, ex, title = exLabel(3, 'write')) {
  initScore(id, 1);
  return `
    <section class="card ex" id="${id}">
      <div class="ex-head">
        <div class="ex-title">${title}</div>
        <div class="track" data-track="${id}">✓ 0/1</div>
      </div>
      <div class="jp"><b>${esc(field(ex, 'instruction_jp'))}</b></div>
      ${hEN(field(ex, 'instruction_en'))}
      <div class="refbox">
        ${field(ex, 'example_jp') ? `<div class="jp">${esc(field(ex, 'example_jp'))}</div>` : ''}
        ${hEN(field(ex, 'example_en'))}
        <div class="key-en" style="white-space:pre-line;margin-top:8px">${esc(field(ex, 'example_text', 'example'))}</div>
      </div>
      <textarea class="free-text" placeholder="Write here..." oninput="setScore('${id}', this.value.trim() ? 1 : 0, 1)"></textarea>
    </section>
  `;
}

function bindAll() {
  bindScene();
  bindFill();
  bindBuild();
  bindKotoba();
}

function bindScene() {
  let selectedChoice = null;
  $$('[data-sc-choice]').forEach(c => c.onclick = () => {
    if (c.classList.contains('ok')) return;
    $$('[data-sc-choice]').forEach(x => x.classList.remove('sel'));
    c.classList.add('sel');
    selectedChoice = c;
  });

  $$('[data-sc-scene]').forEach(s => s.onclick = () => {
    if (!selectedChoice || s.classList.contains('ok')) return;
    const ok = String(selectedChoice.dataset.correct) === String(s.dataset.scScene);
    selectedChoice.classList.add(ok ? 'ok' : 'no');
    s.classList.add(ok ? 'ok' : 'no');

    if (ok) {
      selectedChoice.classList.remove('sel');
      selectedChoice = null;
      setScore('a1', $$('#a1 [data-sc-choice].ok').length, scores.a1.total);
    } else {
      const wrongChoice = selectedChoice;
      setTimeout(() => {
        wrongChoice.classList.remove('no');
        s.classList.remove('no');
      }, 650);
    }
  });
}

function bindFill() {
  $$('[data-fill-item]').forEach(item => {
    let chosen = [];
    const slots = () => [...item.querySelectorAll('.slot')];

    item.querySelectorAll('[data-fill-tile]').forEach(t => t.onclick = () => {
      if (chosen.length >= slots().length) return;
      item.querySelector('.result').className = 'result';
      slots().forEach(x => x.classList.remove('ok', 'no'));
      t.classList.add('used');
      chosen.push(t.textContent.trim());
      const slot = slots()[chosen.length - 1];
      slot.textContent = t.textContent.trim();
      slot.dataset.word = t.textContent.trim();
      refreshSectionScore(item);
    });

    item.querySelector('[data-fill-check]').onclick = () => {
      const answers = JSON.parse(item.dataset.answers || '[]').map(norm);
      const ok = JSON.stringify(chosen.map(norm)) === JSON.stringify(answers);
      slots().forEach(x => {
        x.classList.remove('ok', 'no');
        x.classList.add(ok ? 'ok' : 'no');
      });
      const r = item.querySelector('.result');
      r.className = 'result ' + (ok ? 'ok' : 'no');
      r.textContent = ok ? '✅ Correct!' : `❌ Try again. Answer: ${JSON.parse(item.dataset.answers || '[]').join(' ')}`;
      refreshSectionScore(item);
    };

    item.querySelector('[data-fill-reset]').onclick = () => {
      chosen = [];
      slots().forEach(s => { s.textContent = ''; s.className = 'slot'; });
      item.querySelectorAll('[data-fill-tile]').forEach(t => t.classList.remove('used'));
      item.querySelector('.result').className = 'result';
      refreshSectionScore(item);
    };
  });
}

function bindBuild() {
  $$('[data-build-item]').forEach(item => {
    const answer = item.querySelector('.answer');

    item.querySelectorAll('[data-build-tile]').forEach(t => t.onclick = () => {
      item.querySelector('.result').className = 'result';
      refreshSectionScore(item);
      t.classList.add('used');
      const a = document.createElement('button');
      a.className = 'answer-tile';
      a.textContent = t.textContent;
      a.onclick = () => {
        t.classList.remove('used');
        a.remove();
        item.querySelector('.result').className = 'result';
        refreshSectionScore(item);
      };
      answer.appendChild(a);
    });

    item.querySelector('[data-build-check]').onclick = () => {
      const built = [...answer.children].map(x => x.textContent).join(' ');
      const ok = norm(built) === norm(item.dataset.correct);
      const r = item.querySelector('.result');
      r.className = 'result ' + (ok ? 'ok' : 'no');
      r.textContent = ok ? '✅ Correct!' : `❌ Answer: ${item.dataset.correct}`;
      refreshSectionScore(item);
    };

    item.querySelector('[data-build-reset]').onclick = () => {
      answer.innerHTML = '';
      item.querySelectorAll('[data-build-tile]').forEach(t => t.classList.remove('used'));
      item.querySelector('.result').className = 'result';
      refreshSectionScore(item);
    };
  });
}

function bindKotoba() {
  $$('[data-kotoba-item]').forEach(item => {
    item.querySelectorAll('[data-kotoba-tile]').forEach(t => t.onclick = () => {
      item.querySelectorAll('[data-kotoba-tile]').forEach(x => x.classList.remove('ok', 'no'));
      const ok = norm(t.textContent) === norm(item.dataset.correct);
      t.classList.add(ok ? 'ok' : 'no');
      const r = item.querySelector('.result');
      r.className = 'result ' + (ok ? 'ok' : 'no');
      r.textContent = ok ? '✅ Correct!' : `❌ Try again. Answer: ${item.dataset.correct}`;
      setScore('kotoba', $$('#kotoba .result.ok').length, scores.kotoba.total);
    });
  });
}

async function goSet(d) {
  const maxSet = await countSets();
  if (set === 'drill') {
    if (d < 0 && maxSet) {
      set = maxSet;
      updateUrlSet(set);
      await load();
      window.scrollTo(0, 0);
    }
    return;
  }

  const next = set + d;

  if (next < 1) return;

  if (maxSet && next > maxSet) {
    set = maxSet;
    updateUrlSet(set);
    await load();
    window.scrollTo(0, 0);
    return;
  }

  if (!(await fileExists(next))) {
    return;
  }

  set = next;
  const url = new URL(location.href);
  url.searchParams.set('unit', unit);
  url.searchParams.set('set', set);
  history.pushState(null, '', url);
  await load();
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', () => location.reload());
load();
</script>
