<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word — Leo's English League</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper:        #FAFAF7;
      --surface:      #FFFFFF;
      --soft:         #F0EEE8;
      --border:       #E5E3DC;
      --ink:          #111111;
      --ink-2:        #5A5853;
      --ink-3:        #6B6963;
      --ink-4:        #9A9A95;
      --yellow:       #FFCC00;
      --yellow-bg:    #FFFBE6;
      --yellow-ink:  #8B6B00;
      --academic:     #0284C7;
      --academic-bg:  #F0F9FF;
      --academic-ink: #075985;
      --related:      #737373;
      --related-bg:   #F5F5F5;
      --content-ink:  #713F12;
      --content-bg:   #FEF3C7;
      --extras-bg:    #FDE68A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* Topbar */
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: var(--ink); color: #FFFFFF; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .yellow-mark { background: var(--yellow); color: var(--ink); font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.18em; padding: 5px 10px 4px; }
    .brand-text { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #FFFFFF; text-decoration: none; }
    .crumb { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-4); }
    .crumb a { color: var(--ink-4); text-decoration: none; }
    .crumb .active { color: var(--yellow); }
    .crumb .sep { color: var(--yellow); margin: 0 6px; }

    /* Container */
    .container { max-width: 860px; margin: 0 auto; padding: 24px 32px 48px; }
    .back-link { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px; display: inline-block; cursor: pointer; text-decoration: none; }
    .back-link:hover { color: var(--ink); }

    /* Loading / error / not-found states */
    .state-msg { text-align: center; padding: 60px 24px; }
    .state-msg .ico { font-size: 48px; margin-bottom: 16px; }
    .state-msg h2 { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; color: var(--ink); }
    .state-msg p { color: var(--ink-2); font-size: 15px; line-height: 1.6; max-width: 520px; margin: 0 auto; }
    .state-msg .home-link { display: inline-block; margin-top: 24px; padding: 10px 20px; background: var(--ink); color: var(--yellow); font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; }
    .state-msg .home-link:hover { background: var(--yellow); color: var(--ink); }

    /* Page meta */
    .page-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .tag { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: var(--ink-3); background: var(--surface); padding: 4px 8px 3px; border: 1px solid var(--border); text-transform: uppercase; }
    .tag.academic { background: var(--academic); color: #FFFFFF; border-color: var(--academic); }
    .tag.related  { background: var(--related-bg); color: var(--related); border-color: var(--related); }
    .tag.content  { background: var(--content-bg); color: var(--content-ink); border-color: var(--content-ink); }
    .tag.extras   { background: var(--extras-bg); color: var(--yellow-ink); border-color: var(--yellow-ink); }
    .tag.vocab    { background: var(--yellow); color: var(--ink); border-color: var(--ink); }
    .tag.origin   { background: var(--academic-bg); color: var(--academic-ink); border-color: var(--academic); }
    .unit-tag { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }

    /* Visual slot */
    .visual-slot { background: var(--surface); border: 1px solid var(--ink); margin-bottom: 24px; overflow: hidden; }
    .visual-head { background: var(--ink); color: #FFFFFF; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
    .visual-head .bar { width: 18px; height: 3px; background: var(--yellow); }
    .visual-head .label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--yellow); }
    .visual-body { background: var(--yellow-bg); height: 280px; display: flex; align-items: center; justify-content: center; }
    .visual-body .mega-emoji { font-size: 160px; line-height: 1; user-select: none; }

    /* Word head */
    .word-head { margin-bottom: 22px; }
    .word-top-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    .word { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 64px; line-height: 1; color: var(--ink); }
    .audio-btn { width: 48px; height: 48px; border: 1.5px solid var(--ink); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); transition: all 0.15s ease; }
    .audio-btn:hover { background: var(--ink); color: var(--yellow); }
    .audio-btn:active { transform: scale(0.95); }
    .audio-btn.speaking { background: var(--yellow); color: var(--ink); animation: pulse 0.9s ease infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    .pron-row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
    .pron-item { display: flex; align-items: baseline; gap: 8px; }
    .pron-label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-4); }
    .pron-value { font-family: 'Inter', sans-serif; font-size: 17px; color: var(--ink-2); font-style: italic; }
    .syllables .pron-value { font-style: normal; color: var(--ink); font-weight: 500; }
    .pron-divider { width: 1px; height: 18px; background: var(--border); }
    .grammar-meta { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-4); }

    /* Sentence card */
    .sentence-card { background: var(--yellow-bg); border: 1px solid var(--border); border-left: 3px solid var(--yellow); padding: 18px 22px; margin-bottom: 22px; }
    .sentence-label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--yellow-ink); margin-bottom: 8px; }
    .sentence-text { font-size: 20px; line-height: 1.5; color: var(--ink); font-family: 'Inter', sans-serif; }
    .sentence-text b { font-weight: 600; background: var(--yellow); padding: 0 4px; }

    /* Skeleton notice — for Academic words with empty rich fields */
    .skeleton-notice { background: var(--soft); border: 1px dashed var(--ink-3); padding: 16px 20px; margin-bottom: 22px; text-align: center; }
    .skeleton-notice .ico { font-size: 24px; margin-bottom: 6px; }
    .skeleton-notice .msg { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
    .skeleton-notice .sub { font-size: 13px; color: var(--ink-2); }

    /* Master Japanese toggle */
    .master-jp-toggle-row { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); }
    .master-jp-toggle-label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }
    .master-jp-toggle-label .ja { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; letter-spacing: 0.04em; text-transform: none; color: var(--ink-2); font-weight: 500; margin-left: 6px; }

    .switch { position: relative; display: inline-block; width: 56px; height: 28px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch-slider { position: absolute; cursor: pointer; inset: 0; background: var(--border); transition: 0.2s; border: 1.5px solid var(--ink); }
    .switch-slider::before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; top: 50%; transform: translateY(-50%); background: var(--ink); transition: 0.2s; }
    .switch input:checked + .switch-slider { background: var(--yellow); }
    .switch input:checked + .switch-slider::before { transform: translate(26px, -50%); background: var(--ink); }

    .switch-state { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); margin-left: auto; }
    .switch-state.on { color: var(--ink); }

    /* JP hide rules */
    body.jp-hidden .jp-block-inline { display: none; }
    body.jp-hidden .example-jp { display: none; }
    body.jp-hidden .colloc-jp,
    body.jp-hidden .colloc-arrow { display: none; }
    body.jp-hidden .note-callout { display: none; }
    body.jp-hidden .try-it-jp { display: none; }
    body.jp-hidden .rich-section-head .jp-label { display: none; }

    .jp-block-inline, .example-jp, .colloc-jp, .colloc-arrow, .note-callout, .try-it-jp, .rich-section-head .jp-label { transition: opacity 0.2s; }

    /* Rich sections */
    .rich-section { background: var(--surface); border: 1px solid var(--border); margin-bottom: 18px; overflow: hidden; }
    .rich-section-head { background: var(--ink); color: #FFFFFF; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
    .rich-section-head .bar { width: 16px; height: 3px; background: var(--academic); }
    .rich-section-head .label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--academic); }
    .rich-section-head .jp-label { font-family: 'Noto Sans JP', sans-serif; font-weight: 500; font-size: 12px; margin-left: auto; color: #FFFFFF; }
    .rich-section-body { padding: 20px 22px; }

    .en-block { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.65; color: var(--ink); }
    .en-block.dense { font-size: 15px; }
    .en-block ul { list-style: none; margin-top: 4px; }
    .en-block li { padding: 6px 0; padding-left: 18px; position: relative; }
    .en-block li::before { content: "•"; position: absolute; left: 4px; color: var(--academic); font-weight: 700; }

    .jp-block-inline { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .jp-mini-label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--academic-ink); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .jp-mini-label .ja { font-family: 'Noto Sans JP', sans-serif; font-weight: 500; letter-spacing: 0.05em; text-transform: none; color: var(--ink-3); font-size: 12px; }
    .jp-mini-label .bar { width: 14px; height: 2px; background: var(--academic); }
    .jp-body { font-family: 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.8; color: var(--ink); font-weight: 400; }
    .jp-body ul { list-style: none; margin-top: 4px; }
    .jp-body li { padding: 4px 0; padding-left: 22px; position: relative; }
    .jp-body li::before { content: "▸"; position: absolute; left: 4px; color: var(--academic); }
    .jp-body .arrow { color: var(--academic); font-weight: 600; padding: 0 4px; }

    .structure { display: inline-block; background: var(--soft); padding: 6px 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); margin-top: 6px; border-left: 3px solid var(--academic); }
    .jp-body .structure { font-family: 'Noto Sans JP', sans-serif; font-weight: 500; }

    /* Examples */
    .examples-grid { display: flex; flex-direction: column; gap: 12px; }
    .example-card { background: var(--paper); border: 1px solid var(--border); padding: 14px 16px; }
    .example-context { display: inline-flex; align-items: center; gap: 6px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--academic-ink); background: var(--academic-bg); padding: 3px 8px 2px; margin-bottom: 8px; }
    .example-context .ico { font-size: 13px; line-height: 1; }
    .example-en { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); margin-bottom: 4px; }
    .example-en b { font-weight: 600; background: var(--yellow); padding: 0 3px; }
    .example-jp { font-family: 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.6; color: var(--ink-2); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
    .example-jp b { font-weight: 600; background: var(--yellow-bg); padding: 0 3px; }

    /* Collocations */
    .collocations-list { display: flex; flex-direction: column; gap: 0; }
    .collocation { display: flex; align-items: baseline; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .collocation:last-child { border-bottom: 0; }
    .colloc-en { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); min-width: 110px; }
    .colloc-en::before { content: attr(data-word) " "; color: var(--ink-3); font-weight: 400; }
    .colloc-arrow { color: var(--academic); font-weight: 700; }
    .colloc-jp { font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--ink-2); }

    /* Note callout */
    .note-callout { background: var(--academic-bg); border: 1px solid var(--academic); border-left: 4px solid var(--academic); padding: 18px 20px; margin-bottom: 18px; }
    .note-head { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--academic-ink); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .note-head .ja { font-family: 'Noto Sans JP', sans-serif; font-weight: 600; letter-spacing: 0.04em; text-transform: none; font-size: 14px; }
    .note-body { font-family: 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.85; color: var(--ink); }
    .note-body em { font-style: normal; background: #FFFFFF; padding: 1px 6px; font-weight: 500; border: 1px solid var(--academic); display: inline-block; margin: 2px 1px; font-family: 'Inter', sans-serif; color: var(--academic-ink); }
    .note-body .arrow { color: var(--academic); font-weight: 700; }

    /* Try it */
    .try-it-card { background: var(--surface); border: 1px solid var(--ink); padding: 18px 20px; margin-bottom: 28px; }
    .try-it-head { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    .try-it-head .ico { font-size: 18px; line-height: 1; }
    .try-it-head .ja { font-family: 'Noto Sans JP', sans-serif; font-weight: 600; letter-spacing: 0.04em; text-transform: none; font-size: 14px; color: var(--ink-3); margin-left: auto; }
    .try-it-en { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.55; color: var(--ink); margin-bottom: 10px; }
    .try-it-en b { font-weight: 600; background: var(--yellow); padding: 0 3px; }
    .try-it-jp { font-family: 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.7; color: var(--ink-2); padding-top: 10px; border-top: 1px dashed var(--border); }
    .try-it-jp b { font-weight: 600; background: var(--yellow-bg); padding: 0 3px; }

    /* Basic JP collapsible (dictionary-style data) */
    .jp-section { margin-bottom: 24px; }
    .jp-toggle { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; padding: 10px 18px; background: var(--yellow); color: var(--ink); border: 1.5px solid var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .jp-toggle:hover { background: var(--ink); color: var(--yellow); }
    .jp-toggle .chevron { transition: transform 0.15s ease; width: 12px; height: 12px; }
    .jp-toggle.open .chevron { transform: rotate(180deg); }
    .jp-card { display: none; background: var(--surface); border: 1px solid var(--border); margin-top: 12px; overflow: hidden; }
    .jp-card.open { display: block; }
    .jp-section-head { background: var(--ink); color: #FFFFFF; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
    .jp-section-head .bar { width: 16px; height: 3px; background: var(--yellow); }
    .jp-section-head .label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--yellow); }
    .jp-section-head .jp-label { font-family: 'Noto Sans JP', sans-serif; font-weight: 500; font-size: 13px; margin-left: auto; color: #FFFFFF; }
    .jp-block { padding: 18px 22px; border-bottom: 1px solid var(--border); }
    .jp-block:last-child { border-bottom: 0; }
    .jp-block-label { display: flex; align-items: baseline; gap: 8px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
    .jp-block-label .ja { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; letter-spacing: 0.05em; font-weight: 500; color: var(--ink-2); text-transform: none; }
    .jp-word { font-family: 'Noto Sans JP', sans-serif; font-size: 30px; line-height: 1.3; color: var(--ink); font-weight: 500; margin-bottom: 4px; }
    .jp-reading { font-size: 13px; color: var(--ink-3); font-style: italic; }
    .jp-sentence { font-family: 'Noto Sans JP', sans-serif; font-size: 17px; line-height: 1.7; color: var(--ink); font-weight: 400; }
    .jp-sentence b { font-weight: 600; background: var(--yellow-bg); padding: 0 3px; }
    .jp-grammar-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .jp-grammar-tag { font-family: 'Noto Sans JP', sans-serif; font-weight: 500; font-size: 14px; padding: 5px 11px 4px; background: var(--yellow-bg); color: var(--yellow-ink); border: 1px solid var(--yellow); }

    /* Mobile */
    @media (max-width: 700px) {
      .word { font-size: 48px; }
      .visual-body { height: 220px; }
      .visual-body .mega-emoji { font-size: 110px; }
      .sentence-text { font-size: 17px; }
      .pron-row { gap: 10px; }
      .pron-divider { display: none; }
      .topbar { padding: 14px 20px; }
      .container { padding: 20px 20px 40px; }
      .rich-section-body { padding: 16px 18px; }
      .en-block { font-size: 15px; }
      .jp-body { font-size: 15px; }
      .colloc-en { min-width: 90px; font-size: 14px; }
      .colloc-jp { font-size: 13px; }
    }

    ruby { ruby-position: over; }
    rt { font-size: 0.55em; color: var(--ink-3); font-weight: 400; letter-spacing: 0.04em; }

    .hidden { display: none !important; }
  </style>
</head>
<body class="jp-hidden">

  <header class="topbar">
    <div class="brand">
      <div class="yellow-mark">LEL</div>
      <a href="index.html" class="brand-text">Leo's English League</a>
    </div>
    <div class="crumb" id="crumb">
      <a href="index.html">Home</a><span class="sep">/</span>
      <a href="our-world.html">Our World</a>
    </div>
  </header>

  <main class="container" id="main">
    <div class="state-msg" id="loadingState">
      <div class="ico">⏳</div>
      <h2>Loading…</h2>
    </div>
  </main>

  <script>
    // ════════════════════════════════════════════════════════════════
    // CONSTANTS
    // ════════════════════════════════════════════════════════════════

    const COMPONENT_NAMES = {
      Op: "Opener",
      V1: "Vocab 1",
      V2: "Vocab 2",
      G1: "Grammar 1",
      G2: "Grammar 2",
      So: "Song",
      Re: "Reading",
      Wr: "Writing",
      Mi: "Mission",
      Pr: "Project",
      Bk: "Book Reading"
    };

    const CATEGORY_LABELS = {
      academic: "Academic Language",
      related:  "Related Vocabulary",
      content:  "Content Vocabulary",
      extras:   "Additional Vocabulary",
      vocab:    "Vocabulary"
    };

    // ════════════════════════════════════════════════════════════════
    // URL PARSING
    // ════════════════════════════════════════════════════════════════

    function getParams() {
      const p = new URLSearchParams(window.location.search);
      // Accept BOTH ?word= (glossary convention) and ?id= (existing V1/V2 convention)
      const word = (p.get('word') || p.get('id') || '').trim();
      const unitRaw = p.get('unit');
      const setRaw = p.get('set');
      return {
        level: parseInt(p.get('level'), 10) || null,
        word: word,
        unit: unitRaw ? parseInt(unitRaw, 10) : null,
        set: setRaw ? parseInt(setRaw, 10) : null
      };
    }

    // Parse tag like "L4U8Op" → { level: 4, unit: 8, component: "Op", componentName: "Opener" }
    function parseTag(tag) {
      const m = (tag || '').match(/^L(\d+)U(\d+)([A-Za-z]+)$/);
      if (!m) return null;
      return {
        raw: tag,
        level: parseInt(m[1], 10),
        unit: parseInt(m[2], 10),
        component: m[3],
        componentName: COMPONENT_NAMES[m[3]] || m[3]
      };
    }

    // ════════════════════════════════════════════════════════════════
    // DATA LOADING
    // ════════════════════════════════════════════════════════════════

    async function loadJson(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        console.warn(`Failed to load ${path}:`, e);
        return null;
      }
    }

    async function findEntry(level, wordId, unitHint, setHint) {
      // 1. Try level-wide glossary.json
      const glossary = await loadJson(`content/our-world/level-${level}/glossary.json`);
      if (glossary && Array.isArray(glossary.words)) {
        const hit = glossary.words.find(w => w.id === wordId);
        if (hit) return { entry: hit, source: 'glossary' };
      }
      // 2. Try level-wide extras.json
      const extras = await loadJson(`content/our-world/level-${level}/extras.json`);
      if (extras && Array.isArray(extras.words)) {
        const hit = extras.words.find(w => w.id === wordId);
        if (hit) return { entry: hit, source: 'extras' };
      }
      // 3. Per-unit V1/V2 fallback (existing tile URL pattern: ?unit=N&set=N&id=ID)
      //    Per-unit JSONs predate the glossary architecture and may use either
      //    {words: [...]} or {items: [...]} or a top-level array. We try all.
      if (unitHint && setHint) {
        const unitPath = `content/our-world/level-${level}/unit-${unitHint}/vocab-${setHint}.json`;
        const unitData = await loadJson(unitPath);
        if (unitData) {
          const list = Array.isArray(unitData) ? unitData
                     : Array.isArray(unitData.words) ? unitData.words
                     : Array.isArray(unitData.items) ? unitData.items
                     : [];
          const hit = list.find(w => w.id === wordId);
          if (hit) {
            // Synthesize a unit-specific origin tag so the breadcrumb works.
            // The category 'vocab' renders with the bright-yellow V1/V2 styling.
            const synthTag = `L${level}U${unitHint}V${setHint}`;
            return {
              entry: { ...hit, category: hit.category || 'vocab', tags: hit.tags || [synthTag] },
              source: `unit-${unitHint}/vocab-${setHint}`
            };
          }
        }
      }
      return null;
    }

    // ════════════════════════════════════════════════════════════════
    // RENDER STATE DETECTION
    // ════════════════════════════════════════════════════════════════

    function isRichAcademic(entry) {
      if (entry.category !== 'academic') return false;
      // Treat as rich only if the core fields are populated
      return Boolean(entry.meaning && entry.meaning.trim());
    }

    function isSkeletonAcademic(entry) {
      return entry.category === 'academic' && !isRichAcademic(entry);
    }

    // ════════════════════════════════════════════════════════════════
    // ESCAPE HELPER (basic — string values are trusted authored content,
    // but we still escape stray <script> just in case)
    // ════════════════════════════════════════════════════════════════

    function safeHTML(s) {
      // We pass through <b> tags (authored), but block <script> etc.
      // Authored content uses only <b> for highlighting.
      if (typeof s !== 'string') return '';
      return s.replace(/<(?!\/?b\b)[^>]*>/gi, '');
    }

    // ════════════════════════════════════════════════════════════════
    // RENDER PIECES
    // ════════════════════════════════════════════════════════════════

    function renderCrumb(entry, originTag) {
      const crumb = document.getElementById('crumb');
      const parts = [
        `<a href="index.html">Home</a><span class="sep">/</span>`,
        `<a href="our-world.html">Our World</a>`
      ];
      if (originTag) {
        parts.push(`<span class="sep">/</span><a href="our-world.html">Level ${originTag.level}</a>`);
        parts.push(`<span class="sep">/</span><a href="our-world.html">Unit ${originTag.unit}</a>`);
      }
      parts.push(`<span class="sep">/</span><span class="active">${entry.word}</span>`);
      crumb.innerHTML = parts.join('');
    }

    function renderPageMeta(entry, source, originTag) {
      const catLabel = CATEGORY_LABELS[entry.category] || entry.category;
      const catClass = entry.category;
      const originLabel = originTag
        ? `L${originTag.level}U${originTag.unit} · ${originTag.componentName}`
        : '';
      const sourceLabel = source === 'extras' ? 'Extras' : '';

      return `
        <div class="page-meta">
          <div class="tag ${catClass}">${catLabel}</div>
          ${originLabel ? `<div class="tag origin">${originLabel}</div>` : ''}
          ${sourceLabel ? `<div class="tag extras">${sourceLabel}</div>` : ''}
          <div class="unit-tag">Level ${originTag ? originTag.level : '?'}${originTag ? ` · Unit ${originTag.unit}` : ''}</div>
        </div>
      `;
    }

    function renderVisualSlot(entry) {
      return `
        <section class="visual-slot">
          <div class="visual-head">
            <div class="bar"></div>
            <div class="label">Visual</div>
          </div>
          <div class="visual-body">
            <div class="mega-emoji">${entry.emoji || '📖'}</div>
          </div>
        </section>
      `;
    }

    function renderWordHead(entry) {
      return `
        <section class="word-head">
          <div class="word-top-row">
            <div class="word">${entry.word}</div>
            <button class="audio-btn" id="audioBtn" aria-label="Play pronunciation">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </button>
          </div>
          <div class="pron-row">
            ${entry.ipa ? `
              <div class="pron-item">
                <span class="pron-label">IPA</span>
                <span class="pron-value">${entry.ipa}</span>
              </div>
            ` : ''}
            ${entry.ipa && entry.syllables ? `<div class="pron-divider"></div>` : ''}
            ${entry.syllables ? `
              <div class="pron-item syllables">
                <span class="pron-label">Syllables</span>
                <span class="pron-value">${entry.syllables}</span>
              </div>
            ` : ''}
          </div>
          ${entry.pos ? `<div class="grammar-meta">${entry.pos}</div>` : ''}
        </section>
      `;
    }

    function renderSentenceCard(entry) {
      if (!entry.sample) return '';
      return `
        <section class="sentence-card">
          <div class="sentence-label">Sample sentence</div>
          <div class="sentence-text">${safeHTML(entry.sample)}</div>
        </section>
      `;
    }

    function renderSkeletonNotice() {
      return `
        <div class="skeleton-notice">
          <div class="ico">📝</div>
          <div class="msg">In-depth content coming soon</div>
          <div class="sub">The full mini-lesson for this Academic word will be added when its lesson component is built.</div>
        </div>
      `;
    }

    function renderMasterJpToggle() {
      return `
        <div class="master-jp-toggle-row">
          <div class="master-jp-toggle-label">
            Japanese explanations
            <span class="ja">日本語の説明</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="jpMasterToggle">
            <span class="switch-slider"></span>
          </label>
          <div class="switch-state" id="jpStateLabel">OFF</div>
        </div>
      `;
    }

    // ────────────────────────────────────────────────────────────────
    // RICH ACADEMIC SECTIONS
    // ────────────────────────────────────────────────────────────────

    function renderSectionMeaning(entry) {
      if (!entry.meaning) return '';
      return `
        <section class="rich-section">
          <div class="rich-section-head">
            <div class="bar"></div>
            <div class="label">What it means</div>
            <div class="jp-label">意味</div>
          </div>
          <div class="rich-section-body">
            <div class="en-block">${safeHTML(entry.meaning)}</div>
            ${entry.jp_meaning ? `
              <div class="jp-block-inline">
                <div class="jp-mini-label">
                  <span class="bar"></span>
                  Japanese explanation
                  <span class="ja">日本語の説明</span>
                </div>
                <div class="jp-body">${entry.jp_meaning}</div>
              </div>
            ` : ''}
          </div>
        </section>
      `;
    }

    function renderSectionWhenToUse(entry) {
      const en = entry.when_to_use || [];
      const jp = entry.jp_when_to_use || [];
      if (en.length === 0) return '';
      return `
        <section class="rich-section">
          <div class="rich-section-head">
            <div class="bar"></div>
            <div class="label">When you see it</div>
            <div class="jp-label">いつ使うか</div>
          </div>
          <div class="rich-section-body">
            <div class="en-block dense">
              <ul>${en.map(x => `<li>${safeHTML(x)}</li>`).join('')}</ul>
            </div>
            ${jp.length ? `
              <div class="jp-block-inline">
                <div class="jp-mini-label">
                  <span class="bar"></span>
                  Japanese examples
                  <span class="ja">日本語での例</span>
                </div>
                <div class="jp-body">
                  <ul>${jp.map(x => `<li>${x}</li>`).join('')}</ul>
                </div>
              </div>
            ` : ''}
          </div>
        </section>
      `;
    }

    function renderSectionHowToUse(entry) {
      const how = entry.how_to_use || {};
      const jpHow = entry.jp_how_to_use || {};
      if (!how.structure && (!how.patterns || how.patterns.length === 0)) return '';
      return `
        <section class="rich-section">
          <div class="rich-section-head">
            <div class="bar"></div>
            <div class="label">How to use it</div>
            <div class="jp-label">使い方</div>
          </div>
          <div class="rich-section-body">
            <div class="en-block dense">
              ${how.structure ? `<strong style="font-weight:600">Structure:</strong>
                <div class="structure">${safeHTML(how.structure)}</div>` : ''}
              ${(how.patterns && how.patterns.length) ? `
                <ul style="margin-top:10px">
                  ${how.patterns.map(p => `<li>${safeHTML(p)}</li>`).join('')}
                </ul>
              ` : ''}
            </div>
            ${(jpHow.structure || (jpHow.patterns && jpHow.patterns.length)) ? `
              <div class="jp-block-inline">
                <div class="jp-mini-label">
                  <span class="bar"></span>
                  Japanese pattern guide
                  <span class="ja">日本語の使い方</span>
                </div>
                <div class="jp-body">
                  ${jpHow.structure ? `<strong style="font-weight:600">基本の形：</strong>
                    <div class="structure">${jpHow.structure}</div>` : ''}
                  ${(jpHow.patterns && jpHow.patterns.length) ? `
                    <ul style="margin-top:10px">
                      ${jpHow.patterns.map(p => `<li>${p}</li>`).join('')}
                    </ul>
                  ` : ''}
                </div>
              </div>
            ` : ''}
          </div>
        </section>
      `;
    }

    const EXAMPLE_ICONS = {
      Academic: '📝',
      Spoken: '💬',
      Test: '📋',
      Writing: '✍️',
      Conversation: '💬'
    };

    function renderSectionExamples(entry) {
      const ex = entry.examples || [];
      if (ex.length === 0) return '';
      return `
        <section class="rich-section">
          <div class="rich-section-head">
            <div class="bar"></div>
            <div class="label">Examples in different situations</div>
            <div class="jp-label">いろいろな例文</div>
          </div>
          <div class="rich-section-body">
            <div class="examples-grid">
              ${ex.map(e => {
                const ico = EXAMPLE_ICONS[e.context_en] || '✨';
                return `
                  <div class="example-card">
                    <div class="example-context"><span class="ico">${ico}</span>${e.context_en || ''}${e.context_jp ? ` · ${e.context_jp}` : ''}</div>
                    <div class="example-en">${safeHTML(e.en || '')}</div>
                    ${e.jp ? `<div class="example-jp">${e.jp}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </section>
      `;
    }

    function renderSectionCollocations(entry, headWord) {
      const cols = entry.collocations || [];
      if (cols.length === 0) return '';
      return `
        <section class="rich-section">
          <div class="rich-section-head">
            <div class="bar"></div>
            <div class="label">Common partners</div>
            <div class="jp-label">よく一緒に使う言葉</div>
          </div>
          <div class="rich-section-body">
            <div class="collocations-list">
              ${cols.map(c => `
                <div class="collocation">
                  <span class="colloc-en" data-word="${headWord}">${safeHTML(c.en || '')}</span>
                  <span class="colloc-arrow">→</span>
                  <span class="colloc-jp">${c.jp || ''}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </section>
      `;
    }

    function renderNoteCallout(entry) {
      if (!entry.jp_note) return '';
      return `
        <div class="note-callout">
          <div class="note-head">Watch out! <span class="ja">注意ポイント</span></div>
          <div class="note-body">${entry.jp_note}</div>
        </div>
      `;
    }

    function renderTryIt(entry) {
      if (!entry.practice_prompt) return '';
      return `
        <div class="try-it-card">
          <div class="try-it-head">
            <span class="ico">💭</span>Try it
            <span class="ja">やってみよう</span>
          </div>
          <div class="try-it-en">${safeHTML(entry.practice_prompt)}</div>
          ${entry.jp_practice_prompt ? `<div class="try-it-jp">${entry.jp_practice_prompt}</div>` : ''}
        </div>
      `;
    }

    // ────────────────────────────────────────────────────────────────
    // BASIC JAPANESE CARD (bottom of every page)
    // ────────────────────────────────────────────────────────────────

    function renderBasicJp(entry) {
      if (!entry.jp_word && !entry.jp_sentence) return '';
      const tags = (entry.jp_tags || []).map(t => `<div class="jp-grammar-tag">${t}</div>`).join('');
      return `
        <section class="jp-section">
          <button class="jp-toggle" id="jpToggleBtn" aria-expanded="false">
            <span id="jpToggleLabel">Show basic Japanese info</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="jp-card" id="jpBasicCard">
            <div class="jp-section-head">
              <div class="bar"></div>
              <div class="label">Japanese</div>
              <div class="jp-label">日本語</div>
            </div>
            ${entry.jp_word ? `
              <div class="jp-block">
                <div class="jp-block-label">Word <span class="ja">単語</span></div>
                <div class="jp-word">${entry.jp_word}</div>
                ${entry.jp_reading ? `<div class="jp-reading">${entry.jp_reading}</div>` : ''}
              </div>
            ` : ''}
            ${entry.jp_sentence ? `
              <div class="jp-block">
                <div class="jp-block-label">Sentence <span class="ja">例文</span></div>
                <div class="jp-sentence">${entry.jp_sentence}</div>
              </div>
            ` : ''}
            ${tags ? `
              <div class="jp-block">
                <div class="jp-block-label">Grammar <span class="ja">品詞</span></div>
                <div class="jp-grammar-row">${tags}</div>
              </div>
            ` : ''}
          </div>
        </section>
      `;
    }

    // ════════════════════════════════════════════════════════════════
    // FULL PAGE RENDER
    // ════════════════════════════════════════════════════════════════

    function renderEntry(entry, source) {
      const originTag = parseTag((entry.tags || [])[0]);
      renderCrumb(entry, originTag);

      // Set page title
      document.title = `${entry.word} — Leo's English League`;

      const main = document.getElementById('main');

      let html = '';
      html += `<a href="our-world.html" class="back-link">← Back to Our World</a>`;
      html += renderPageMeta(entry, source, originTag);
      html += renderVisualSlot(entry);
      html += renderWordHead(entry);
      html += renderSentenceCard(entry);

      const rich = isRichAcademic(entry);
      const skeletonAcademic = isSkeletonAcademic(entry);

      // Master JP toggle — only show if there's Japanese content to toggle
      const hasAnyJp = entry.jp_meaning || entry.jp_when_to_use?.length || entry.jp_how_to_use?.structure
        || entry.jp_note || entry.jp_practice_prompt
        || (entry.examples || []).some(e => e.jp);
      if (rich && hasAnyJp) {
        html += renderMasterJpToggle();
      }

      // Skeleton notice
      if (skeletonAcademic) {
        html += renderSkeletonNotice();
      }

      // Rich sections (only if rich)
      if (rich) {
        html += renderSectionMeaning(entry);
        html += renderSectionWhenToUse(entry);
        html += renderSectionHowToUse(entry);
        html += renderSectionExamples(entry);
        html += renderSectionCollocations(entry, entry.word);
        html += renderNoteCallout(entry);
        html += renderTryIt(entry);
      }

      // Basic JP card (always at bottom if jp data present)
      html += renderBasicJp(entry);

      main.innerHTML = html;

      // Wire up interactions
      wireAudioButton(entry.word);
      wireBasicJpToggle();
      if (rich && hasAnyJp) {
        wireMasterJpToggle();
      }
    }

    // ════════════════════════════════════════════════════════════════
    // INTERACTIONS
    // ════════════════════════════════════════════════════════════════

    function wireAudioButton(word) {
      const btn = document.getElementById('audioBtn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.0;
        btn.classList.add('speaking');
        u.onend = () => btn.classList.remove('speaking');
        window.speechSynthesis.speak(u);
      });
    }

    function wireMasterJpToggle() {
      const toggle = document.getElementById('jpMasterToggle');
      const stateLabel = document.getElementById('jpStateLabel');
      if (!toggle || !stateLabel) return;
      toggle.addEventListener('change', e => {
        if (e.target.checked) {
          document.body.classList.remove('jp-hidden');
          stateLabel.textContent = 'ON';
          stateLabel.classList.add('on');
        } else {
          document.body.classList.add('jp-hidden');
          stateLabel.textContent = 'OFF';
          stateLabel.classList.remove('on');
        }
      });
    }

    function wireBasicJpToggle() {
      const btn = document.getElementById('jpToggleBtn');
      const card = document.getElementById('jpBasicCard');
      const label = document.getElementById('jpToggleLabel');
      if (!btn || !card) return;
      btn.addEventListener('click', () => {
        const open = card.classList.toggle('open');
        btn.classList.toggle('open', open);
        if (label) label.textContent = open ? 'Hide basic Japanese info' : 'Show basic Japanese info';
      });
    }

    // ════════════════════════════════════════════════════════════════
    // ERROR STATES
    // ════════════════════════════════════════════════════════════════

    function renderError(title, message) {
      document.getElementById('main').innerHTML = `
        <div class="state-msg">
          <div class="ico">⚠️</div>
          <h2>${title}</h2>
          <p>${message}</p>
          <a href="our-world.html" class="home-link">Back to Our World</a>
        </div>
      `;
    }

    function renderNotFound(wordId, level) {
      document.getElementById('main').innerHTML = `
        <div class="state-msg">
          <div class="ico">🔍</div>
          <h2>Word not found</h2>
          <p>The word <strong>"${wordId}"</strong> wasn't found in Level ${level}'s glossary or extras. It may not be added yet, or the link may be wrong.</p>
          <a href="our-world.html" class="home-link">Back to Our World</a>
        </div>
      `;
    }

    // ════════════════════════════════════════════════════════════════
    // BOOT
    // ════════════════════════════════════════════════════════════════

    async function init() {
      const { level, word, unit, set } = getParams();

      if (!word) {
        renderError('No word specified', 'Please add ?level=N&id=WORDID to the URL (or ?level=N&word=WORDID).');
        return;
      }
      if (!level) {
        renderError('No level specified', 'Please add ?level=N to the URL (e.g. ?level=4&id=describe).');
        return;
      }

      const result = await findEntry(level, word, unit, set);
      if (!result) {
        renderNotFound(word, level);
        return;
      }

      renderEntry(result.entry, result.source);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
