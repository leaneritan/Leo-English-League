<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab — Leo's English Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --nc-green: #2E7D32;
      --nc-green-mid: #388E3C;
      --nc-green-light: #4CAF50;
      --nc-green-pale: #E8F5E9;
      --nc-navy: #1B5E20;
      --coral: #E8735A;
      --gold: #F9A825;
      --text-dark: #1A1A2E;
      --text-mid: #4A4A6A;
      --text-light: #7A7A9A;
      --page-bg: #F4FBF4;
      --card-h: 180px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--page-bg); color: var(--text-dark); }

    /* HEADER */
    .hdr {
      background: linear-gradient(135deg, var(--nc-navy) 0%, var(--nc-green) 70%, var(--nc-green-light) 100%);
      color: white; padding: 18px 20px 14px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .back-btn {
      background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
      color: white; border-radius: 50px; padding: 6px 16px;
      font-family: 'Nunito',sans-serif; font-weight: 700; font-size: 13px;
      cursor: pointer; text-decoration: none; flex-shrink: 0;
    }
    .hdr-title { font-family: 'Baloo 2',cursive; font-size: 22px; font-weight: 800; }
    .hdr-sub { font-size: 13px; opacity: 0.8; font-weight: 600; }
    .hdr-count { margin-left: auto; text-align: right; }
    .hdr-count .n { font-size: 22px; font-weight: 900; display: block; }
    .hdr-count .l { font-size: 11px; opacity: 0.75; font-weight: 700; }

    /* CONTROLS */
    .controls {
      background: white; border-bottom: 2px solid var(--nc-green-pale);
      padding: 12px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .search-wrap {
      flex: 1; min-width: 200px;
      display: flex; align-items: center; gap: 8px;
      background: var(--page-bg); border: 2px solid #D4EDDA; border-radius: 50px; padding: 8px 16px;
    }
    .search-wrap input {
      flex: 1; border: none; outline: none; font-family: 'Nunito',sans-serif; font-size: 14px;
      background: transparent; color: var(--text-dark);
    }
    .search-wrap input::placeholder { color: var(--text-light); }
    .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      border-radius: 50px; padding: 6px 14px; font-family: 'Nunito',sans-serif;
      font-weight: 700; font-size: 12px; cursor: pointer; border: 2px solid transparent;
      transition: all 0.15s;
    }
    .filter-btn.all { background: var(--nc-green); color: white; }
    .filter-btn.inactive { background: white; color: var(--text-mid); border-color: #E0E0E0; }
    .filter-btn.inactive:hover { border-color: var(--nc-green); color: var(--nc-green); }

    /* STATS BAR */
    .stats-bar {
      padding: 10px 20px; font-size: 13px; color: var(--text-mid); font-weight: 600;
      display: flex; gap: 16px; align-items: center;
    }
    .progress-wrap { flex: 1; max-width: 240px; }
    .progress-track { height: 6px; background: #E0E0E0; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(to right, var(--nc-green), var(--nc-green-light)); border-radius: 3px; transition: width 0.4s; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px; padding: 16px 20px 40px;
    }

    /* FLIP CARD */
    .flip-wrap {
      height: var(--card-h); perspective: 1000px; cursor: pointer;
    }
    .flip-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .flip-wrap.flipped .flip-inner { transform: rotateY(180deg); }
    .flip-front, .flip-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 16px;
      display: flex; flex-direction: column;
      box-shadow: 0 3px 12px rgba(46,125,50,0.10);
    }
    .flip-front {
      background: white; border: 1.5px solid var(--nc-green-pale);
      align-items: center; justify-content: center; text-align: center;
      padding: 16px;
    }
    .flip-back {
      background: linear-gradient(135deg, var(--nc-navy) 0%, var(--nc-green) 100%);
      border: none; color: white;
      transform: rotateY(180deg);
      align-items: center; justify-content: center; text-align: center;
      padding: 14px;
    }

    /* FRONT CONTENT */
    .card-tag {
      position: absolute; top: 10px; left: 10px;
      font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
      border-radius: 50px; padding: 2px 8px;
    }
    .card-tag.Starter { background: var(--nc-green-pale); color: var(--nc-green); }
    .card-tag.Lesson1 { background: #E3F2FD; color: #1565C0; }
    .card-tag.MyDictionary { background: #FFF3E0; color: #E65100; }

    .card-emoji { font-size: 32px; margin-bottom: 6px; }
    .card-word { font-family: 'Baloo 2',cursive; font-size: 18px; font-weight: 800; color: var(--nc-navy); }
    .card-ipa { font-size: 11px; color: var(--text-light); font-weight: 600; margin: 2px 0; }
    .card-pos { font-size: 11px; color: var(--nc-green); font-weight: 700; margin-top: 2px; }
    .card-sample { font-size: 11px; color: var(--text-mid); margin-top: 4px; line-height: 1.4; }
    .card-sample b { color: var(--nc-green); font-weight: 900; }
    .card-flip-hint { position: absolute; bottom: 8px; right: 10px; font-size: 10px; opacity: 0.4; }

    /* BACK CONTENT */
    .back-jp-word { font-family: 'Baloo 2',cursive; font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .back-reading { font-size: 12px; opacity: 0.75; margin-bottom: 4px; }
    .back-sentence { font-size: 12px; opacity: 0.85; line-height: 1.5; margin-bottom: 6px; }
    .back-sentence b { opacity: 1; font-weight: 900; }
    .back-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .back-tag { background: rgba(255,255,255,0.2); border-radius: 50px; padding: 2px 8px; font-size: 10px; font-weight: 700; }
    .back-flip-hint { position: absolute; bottom: 8px; right: 10px; font-size: 10px; opacity: 0.4; }

    /* EMPTY */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-light); }
    .empty span { font-size: 40px; display: block; margin-bottom: 10px; }

    /* LOADING */
    .loading { text-align: center; padding: 60px; color: var(--nc-green); font-weight: 700; font-size: 16px; }

    @media (max-width: 500px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px 12px 40px; }
      --card-h: 160px;
    }
  </style>
</head>
<body>

<header class="hdr">
  <a href="junior-high.html" class="back-btn">← JH1</a>
  <div>
    <div class="hdr-title" id="pageTitle">Vocabulary</div>
    <div class="hdr-sub" id="pageSubtitle">Loading...</div>
  </div>
  <div class="hdr-count">
    <span class="n" id="wordCount">—</span>
    <span class="l">words</span>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    🔍
    <input type="text" id="searchInput" placeholder="Search words..." oninput="applyFilters()">
  </div>
  <div class="filter-btns" id="filterBtns"></div>
</div>

<div class="stats-bar">
  <span id="visibleCount">Loading...</span>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <span id="flippedCount">0 studied</span>
</div>

<div id="grid" class="grid">
  <div class="loading">⏳ Loading vocabulary...</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const unit = params.get('unit') || 'starter';

const unitMeta = {
  'starter':  { title: 'Starter Vocabulary',  sub: 'Elementary Review · New Crown JH1' },
  'lesson-1': { title: 'Lesson 1 Vocabulary', sub: 'Nice to Meet You! · New Crown JH1' },
};
const meta = unitMeta[unit] || { title: 'Vocabulary', sub: 'New Crown JH1' };
document.getElementById('pageTitle').textContent = meta.title;
document.getElementById('pageSubtitle').textContent = meta.sub;

let allWords = [];
let activeFilters = new Set(['All']);
let flippedSet = new Set();

const tagStyles = {
  'Starter':      'Starter',
  'My Dictionary':'MyDictionary',
  'Lesson 1':     'Lesson1',
};

async function loadVocab() {
  const path = `content/new-crown/jh1/${unit}/vocab.json`;
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    allWords = data.words || [];
    document.getElementById('wordCount').textContent = allWords.length;
    buildFilters();
    renderGrid(allWords);
  } catch(e) {
    document.getElementById('grid').innerHTML = `<div class="empty"><span>❌</span>Could not load vocabulary.<br><small>${path}</small></div>`;
  }
}

function buildFilters() {
  const tags = ['All', ...new Set(allWords.map(w => w.tag).filter(Boolean))];
  const container = document.getElementById('filterBtns');
  container.innerHTML = '';
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn ' + (tag === 'All' ? 'all' : 'inactive');
    btn.textContent = tag === 'My Dictionary' ? '📖 My Dict' : tag === 'Starter' ? '⭐ ' + tag : '📘 ' + tag;
    btn.dataset.tag = tag;
    btn.addEventListener('click', () => {
      activeFilters = new Set([tag]);
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = 'filter-btn ' + (b.dataset.tag === tag ? 'all' : 'inactive');
      });
      applyFilters();
    });
    container.appendChild(btn);
  });
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const tag = [...activeFilters][0];
  const filtered = allWords.filter(w => {
    const matchTag = tag === 'All' || w.tag === tag;
    const matchQ = !q || w.word.toLowerCase().includes(q) || (w.jp_word||'').includes(q) || (w.jp_reading||'').includes(q);
    return matchTag && matchQ;
  });
  renderGrid(filtered);
}

function renderGrid(words) {
  const grid = document.getElementById('grid');
  document.getElementById('visibleCount').textContent = `${words.length} word${words.length !== 1 ? 's' : ''}`;
  updateProgress();

  if (!words.length) {
    grid.innerHTML = `<div class="empty"><span>🔍</span>No words found</div>`;
    return;
  }

  grid.innerHTML = '';
  words.forEach(w => {
    const tagClass = tagStyles[w.tag] || 'Starter';
    const isFlipped = flippedSet.has(w.id);

    const wrap = document.createElement('div');
    wrap.className = 'flip-wrap' + (isFlipped ? ' flipped' : '');
    wrap.dataset.id = w.id;
    wrap.innerHTML = `
      <div class="flip-inner">
        <div class="flip-front">
          <span class="card-tag ${tagClass}">${w.tag || ''}</span>
          <div class="card-emoji">${w.emoji || '📝'}</div>
          <div class="card-word">${w.word}</div>
          <div class="card-ipa">${w.ipa || ''}</div>
          <div class="card-pos">${w.pos || ''}</div>
          <div class="card-sample">${w.sample || ''}</div>
          <div class="card-flip-hint">tap to flip</div>
        </div>
        <div class="flip-back">
          <div class="back-jp-word">${w.jp_word || ''}</div>
          <div class="back-reading">${w.jp_reading || ''}</div>
          <div class="back-sentence">${(w.jp_sentence || '').replace(/<b>/g,'<b>').replace(/<\/b>/g,'</b>')}</div>
          <div class="back-tags">${(w.jp_tags||[]).map(t=>`<span class="back-tag">${t}</span>`).join('')}</div>
          <div class="back-flip-hint">tap to flip</div>
        </div>
      </div>
    `;
    wrap.addEventListener('click', () => {
      const id = wrap.dataset.id;
      if (flippedSet.has(id)) {
        flippedSet.delete(id);
        wrap.classList.remove('flipped');
      } else {
        flippedSet.add(id);
        wrap.classList.add('flipped');
      }
      updateProgress();
    });
    grid.appendChild(wrap);
  });
}

function updateProgress() {
  const total = allWords.length;
  const studied = flippedSet.size;
  const pct = total ? Math.round(studied / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('flippedCount').textContent = `${studied} studied`;
}

loadVocab();
</script>
</body>
</html>
